// Small, dependency-free helpers for escaping, dates and numbers.

const esc = (value) =>
  String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

/** Tagged template that escapes interpolations unless they are wrapped with raw(). */
function html(strings, ...values) {
  let out = strings[0];
  values.forEach((value, i) => {
    out += render(value) + strings[i + 1];
  });
  return new Raw(out);
}

class Raw {
  constructor(value) { this.value = value; }
  toString() { return this.value; }
}

const raw = (value) => new Raw(String(value ?? ''));

function render(value) {
  if (value == null || value === false) return '';
  if (value instanceof Raw) return value.value;
  if (Array.isArray(value)) return value.map(render).join('');
  return esc(value);
}

// ---- Dates -------------------------------------------------------------

const DAY = 86400000;

/** Local midnight for the demo's "today". Tests may pass a fixed date. */
function startOfDay(date = new Date()) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  return d;
}

const isoDate = (date) => {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

const fromIso = (iso) => {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
};

const addDays = (date, days) => new Date(startOfDay(date).getTime() + days * DAY);

const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / DAY);

function formatDate(date, opts = { weekday: 'short', day: 'numeric', month: 'short' }) {
  return new Intl.DateTimeFormat('en-GB', opts).format(typeof date === 'string' ? fromIso(date) : date);
}

/** "Today", "Tomorrow", "Yesterday", "In 3 days", "12 days ago". */
function relativeDay(iso, today) {

  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return `In ${diff} days`;
  if (diff < -1 && diff > -60) return `${-diff} days ago`;
  return formatDate(iso, { day: 'numeric', month: 'short', year: 'numeric' });
}

function greeting(now = new Date()) {
  const h = now.getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

/** Minutes since midnight for "HH:MM". */
const toMinutes = (time) => {
  const [h, m] = time.split(':').map(Number);
  return h * 60 + m;
};

const fromMinutes = (mins) =>
  `${String(Math.floor(mins / 60) % 24).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;

/** The last `count` calendar quarters that have fully ended before `today`. */
function lastQuarters(today, count = 8) {
  let year = today.getFullYear();
  let q = Math.floor(today.getMonth() / 3); // current quarter index (0-3) is still open
  const out = [];
  for (let i = 0; i < count; i++) {
    q -= 1;
    if (q < 0) { q = 3; year -= 1; }
    out.unshift(`Q${q + 1} ${String(year).slice(2)}`);
  }
  return out;
}

// ---- Numbers -----------------------------------------------------------

const formatNumber = (n) => new Intl.NumberFormat('en-US').format(Math.round(n));

/** A change in percent as words, as the trend arrow reads aloud: "up 12%", "down 3%", or "0%" under 1% either way. */
function changeWords(n) {
  const pct = Math.round(n);
  return pct >= 1 ? `up ${pct}%` : pct <= -1 ? `down ${-pct}%` : '0%';
}

const sum = (values) => values.reduce((a, b) => a + b, 0);

/** Year-over-year change of the last four quarters versus the four before. */
function yoy(series) {
  const recent = sum(series.slice(-4));
  const prior = sum(series.slice(-8, -4));
  return prior ? ((recent - prior) / prior) * 100 : 0;
}

/** Straight-line distance in km between [lon, lat] pairs. */
function haversineKm([lon1, lat1], [lon2, lat2]) {
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(a));
}

const formatKm = (km) => (km < 0.1 ? 'Under 0.1 km' : `${km.toFixed(1)} km`);

const initials = (name) =>
  name.replace(/^Dr\.\s*/, '').split(/\s+/).map((p) => p[0]).slice(0, 2).join('').toUpperCase();

const uid = (prefix = 'id') => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;

const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;

// Deterministic quarterly volumes so the sample data looks lived-in but never changes between visits.

const SHAPE = [0, 3, -2, 1, -1, 2, -3, 1];

/**
 * Eight quarters of volume, oldest first, growing by roughly `growthPerYear`.
 * `base` is the volume of the oldest quarter.
 */
function series(base, growthPerYear) {
  const perQuarter = Math.pow(1 + growthPerYear, 1 / 4);
  return SHAPE.map((wobble, i) => Math.max(0, Math.round(base * Math.pow(perQuarter, i) * (1 + wobble / 60))));
}

/** Element-wise sum of several series. */
function addSeries(list) {
  return list.reduce((acc, s) => acc.map((v, i) => v + s[i]), new Array(SHAPE.length).fill(0));
}

// Ask Field Pro: answers plain-language questions from the rep's own book.
// The prototype matches intents with keywords and computes answers from the
// sample data. The real version would send the question to an LLM that calls
// the same DocNexus endpoints the screens use, and return this answer shape.






/** Starter questions, grouped by the moment in a rep's day they help with. */
const STARTERS = [
  { title: 'Plan the day', questions: ['Who should I see today?', 'What’s on my plan today?', 'Who is near Mount Sinai West?'] },
  { title: 'Before a visit', questions: ['Brief me on Dr. Maya Patel', 'Where does Dr. Alex Morgan refer patients?', 'Top doctors at Mount Sinai Hospital'] },
  { title: 'Your territory', questions: ['Which accounts are growing the most?', 'What has declined?', 'Where am I losing the most volume?', 'What follow-ups are overdue?'] },
];

/** The starter questions, with today's next visit filled in where it helps. */
function startersFor(ctx) {
  const next = routeOrder(activeItems(ctx.ws.plans[ctx.todayIso])).find((i) => i.status === 'planned');
  const who = next ? getEntity(next.targetId) : null;
  if (!who) return STARTERS;
  const about = who.kind === 'hcp' ? `Where does ${who.name} refer patients?` : `Where do patients at ${who.name} go?`;
  return STARTERS.map((g) => (g.title === 'Before a visit' ? { ...g, questions: [`Brief me on ${who.name}`, about, g.questions[2]] } : g));
}

const QUESTION_START = /^(who|what|whats|which|where|when|why|how|show|list|brief|tell|give|any)\b/;

/** True when search text reads like a question, so Targets can offer to ask it. */
function looksLikeQuestion(text) {
  const q = normalise(text);
  if (q.split(' ').length < 2) return false;
  return /\?\s*$/.test(String(text)) || QUESTION_START.test(q) || !['search', 'brief'].includes(detectIntent(q));
}

const normalise = (s) => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9%\s-]/g, ' ').replace(/\s+/g, ' ').trim();

// Names reps actually say: last names, first names and short facility names.
const EXTRA_ALIASES = {
  'msh-system': ['mount sinai health system', 'health system', 'mount sinai'],
  msh: ['mount sinai hospital', 'the main hospital', 'msh'],
  msw: ['mount sinai west', 'sinai west', 'msw'],
  msm: ['mount sinai morningside', 'morningside', 'msm'],
  kidney: ['kidney center', 'kidney'],
  harlem: ['harlem health center', 'harlem clinic', 'harlem'],
};

let aliasIndex = null;
function aliases() {
  if (aliasIndex) return aliasIndex;
  const out = [];
  for (const h of allHcps()) {
    const parts = normalise(h.name.replace(/^Dr\.?\s*/, '')).split(' ');
    for (const a of new Set([parts.join(' '), parts.at(-1), parts[0], `dr ${parts.at(-1)}`])) out.push([a, h.id]);
  }
  for (const o of allOrgs()) {
    out.push([normalise(o.name), o.id]);
    for (const a of EXTRA_ALIASES[o.id] || []) out.push([a, o.id]);
  }
  aliasIndex = out.sort((a, b) => b[0].length - a[0].length);
  return aliasIndex;
}

/** The person or account a question is about, if it names one. */
function findEntity(question) {
  const q = ` ${normalise(question)} `;
  for (const [alias, id] of aliases()) {
    if (q.includes(` ${alias} `)) return getEntity(id);
  }
  return null;
}

const INTENTS = [
  ['followups', /\b(follow ?-?ups?|overdue|owe|to ?-?dos?|tasks?)\b/],
  ['referrals', /\b(refer\w*|sends?|sent)\b/],
  ['mix', /\b(mix|which procedures|what procedures|procedure breakdown|breakdown)\b/],
  ['leakage', /\b(leak\w*|losing|lose|lost|leaving|left the system|out of (the )?system|where do (patients|cases)( [a-z ]+)? go)\b/],
  ['decline', /\b(declin\w*|drop\w*|down|fall\w*|fell|shrink\w*|decreas\w*|slow\w*|worse)\b/],
  ['growth', /\b(grow\w*|increas\w*|rising|rise|fastest|gain\w*|trending up|up the most)\b/],
  ['near', /\b(near|nearby|close to|closest|nearest|around)\b/],
  ['suggest', /\b(who should i|who to (see|visit|call)|suggest\w*|recommend\w*|priorit\w*|where should i go|who next)\b/],
  ['plan', /\b(today|tomorrow|my plan|schedule|agenda|next (visit|stop|meeting)|my day|on my plan|planned)\b/],
  ['people', /\b(top|best|biggest|busiest|key|which) (hcps?|doctors?|surgeons?|physicians?|cardiologists?|people)\b|\bwho (works|practices)\b|\b(doctors|hcps|surgeons|physicians) at\b/],
  ['brief', /\b(brief|tell me about|prep\w*|who is|what should i know|summar\w*|overview|about)\b/],
];

/** Which kind of question this is. */
function detectIntent(question, about = null) {
  const q = normalise(question);
  for (const [intent, pattern] of INTENTS) if (pattern.test(q)) return intent;
  if (findEntity(question) || (about && refersBack(q))) return 'brief';
  return 'search';
}

// "Where does she refer?", "what about there?": the question continues the last answer.
const refersBack = (q) => /\b(she|he|they|her|his|their|them|it|its|there|this (account|doctor|hospital|one|person)|that (account|doctor|hospital|one|person)|same)\b/.test(q);
const PEOPLE_WORDS = /\b(hcps?|doctors?|surgeons?|physicians?|people|cardiologists?|who)\b/;

const listJoin = (items) => (items.length < 2 ? items.join('') : `${items.slice(0, -1).join(', ')} and ${items.at(-1)}`);
const PHRASES = {
  followup: (s) => (s.label.startsWith('Overdue') ? 'an overdue follow-up' : 'a follow-up due'),
  leakage: () => 'leakage risk',
  rising: () => 'rising volume',
  unseen: (s) => (s.label === 'No contact yet' ? 'no contact yet' : 'no visit in 30+ days'),
};
/** Signals as a phrase, e.g. "leakage risk and no visit in 30+ days". */
const reasons = (signals) => listJoin(signals.map((s) => PHRASES[s.id]?.(s) ?? s.label.toLowerCase()));
const possessive = (name) => `${name}’s`;

const SAMPLE = 'Sample data';
const last4 = (series) => sum(series.slice(-4));
const prev4 = (series) => sum(series.slice(0, 4));
const totals = (e) => {
  const rows = proceduresOf(e);
  if (!rows?.length) return null;
  const s = addSeries(rows.map((r) => r.series));
  return { prev: prev4(s), cur: last4(s), growth: procedureYoy(e) };
};
const accounts = () => allOrgs().filter((o) => o.type !== 'Health system' && proceduresOf(o)?.length);

/**
 * Answers a question. `ctx` is the app context (workspace, today, signals,
 * suggestions, planItemFor, dayName). `about` is the entity the conversation
 * is already about, so "where does she refer?" works as a follow-up.
 */
function answer(question, ctx, about = null) {
  const intent = detectIntent(question, about);
  const named = findEntity(question);
  const entity = named || (about && refersBack(normalise(question)) ? getEntity(about) : null);
  const build = BUILDERS[intent] || BUILDERS.search;
  const result = build({ question, q: normalise(question), entity, named, ctx });
  return { intent, about: result.about ?? entity?.id ?? null, ...result };
}

const row = (e, figure, sub, extra = {}) => ({ id: e.id, title: e.name, sub, figure, ...extra });

const BUILDERS = {
  growth({ q, entity, ctx }) {
    const people = PEOPLE_WORDS.test(q);
    if (entity && !(entity.kind === 'hco' && people)) return BUILDERS.trend({ entity });
    const pool = entity ? hcpsAt(entity.id) : people ? allHcps() : accounts();
    const ranked = pool.map((e) => ({ e, t: totals(e) })).filter((r) => r.t).sort((a, b) => b.t.growth - a.t.growth);
    if (!ranked.length) return empty('No procedure volumes to compare yet.');
    const top = ranked[0];
    const pick = ranked.slice(0, 3).find((r) => ctx.signals(r.e).some((s) => s.id === 'leakage' || s.id === 'unseen')) || top;
    const pickSignals = ctx.signals(pick.e).filter((s) => s.id !== 'rising');
    return {
      scope: ['2025 vs the 12 before', entity?.kind === 'hco' ? `At ${entity.name}` : 'Your book', SAMPLE],
      summary: `${top.e.name} grew fastest: ${formatNumber(top.t.prev)} to ${formatNumber(top.t.cur)} procedures (${changeWords(top.t.growth)}).`,
      columns: ['Name', 'Change'],
      rows: ranked.slice(0, 5).map(({ e, t }) => row(e, '', `${e.kind === 'hcp' ? e.specialty : e.typeDetail} · ${formatNumber(t.cur)} procedures`, { change: t.growth, tab: 'volumes' })),
      doThis: {
        text: pickSignals.length ? `${pick.e.name} is growing, with ${reasons(pickSignals)}. Start there.` : `${pick.e.name} is growing fastest. Visit while volume is moving.`,
        label: `Open ${pick.e.name}`, action: 'openProfile', data: { id: pick.e.id, tab: 'volumes' }, add: pick.e.id,
      },
      next: ['What has declined?', 'Where am I losing the most volume?', people ? 'Which accounts are growing the most?' : 'Which doctors are growing the most?'],
      about: pick.e.id,
    };
  },

  decline({ q, entity }) {
    const people = PEOPLE_WORDS.test(q);
    if (entity?.kind === 'hcp') return BUILDERS.trend({ entity });
    const pool = entity?.kind === 'hco' ? hcpsAt(entity.id) : [...(people ? [] : accounts()), ...allHcps()];
    const ranked = pool.map((e) => ({ e, t: totals(e) })).filter((r) => r.t).sort((a, b) => a.t.growth - b.t.growth);
    const down = ranked.filter((r) => r.t.growth < 0);
    if (!down.length) {
      const slow = ranked[0];
      return {
        scope: ['2025 vs the 12 before', SAMPLE],
        summary: `Nothing declined. Slowest growth is ${slow.e.name}, ${changeWords(slow.t.growth)}.`,
        columns: ['Name', 'Change'],
        rows: ranked.slice(0, 5).map(({ e, t }) => row(e, '', `${formatNumber(t.cur)} procedures`, { change: t.growth, tab: 'volumes' })),
        next: ['Which accounts are growing the most?', 'Where am I losing the most volume?'],
      };
    }
    const top = down[0];
    const family = proceduresOf(top.e).map((r) => ({ r, g: (last4(r.series) - prev4(r.series)) })).sort((a, b) => a.g - b.g)[0].r;
    return {
      scope: ['2025 vs the 12 before', entity?.kind === 'hco' ? `At ${entity.name}` : 'People and accounts', SAMPLE],
      summary: `${plural(down.length, 'target')} declined. The biggest drop is ${top.e.name}: ${formatNumber(top.t.prev)} to ${formatNumber(top.t.cur)} procedures (${changeWords(top.t.growth)}).`,
      columns: ['Name', 'Change'],
      rows: down.slice(0, 5).map(({ e, t }) => row(e, '', `${e.kind === 'hcp' ? e.specialty : e.typeDetail} · ${formatNumber(t.cur)} procedures`, { change: t.growth, tab: 'volumes' })),
      doThis: {
        text: `Most of ${possessive(top.e.name)} drop is in ${family.family.toLowerCase()}. Ask where those cases are going now.`,
        label: `Open ${top.e.name}`, action: 'openProfile', data: { id: top.e.id, tab: 'volumes' }, add: top.e.id,
      },
      next: [top.e.kind === 'hcp' ? `Where does ${top.e.name} refer patients?` : `Where do patients at ${top.e.name} go?`, 'Which accounts are growing the most?', 'Where am I losing the most volume?'],
      about: top.e.id,
    };
  },

  leakage({ entity }) {
    if (entity?.kind === 'hco') {
      const l = entity.leakage;
      if (!l) return empty(`${entity.name} doesn’t report leakage. ${entity.leakageUnavailable || ''}`.trim(), entity.id);
      const top = l.destinations[0];
      const destName = (d) => (d.orgId ? getOrg(d.orgId).name : destination(d.ref).name);
      return {
        scope: ['Patients who left', '2025', SAMPLE],
        summary: `${l.leftPct}% of ${formatNumber(l.patients)} patients at ${entity.name} left the system. The biggest destination is ${destName(top)}, with ${formatNumber(top.patients)}.`,
        columns: ['Destination', 'Patients'],
        rows: l.destinations.map((d) => (d.orgId
          ? row(getOrg(d.orgId), formatNumber(d.patients), 'In system', { tab: 'leakage' })
          : { title: destination(d.ref).name, sub: `${destination(d.ref).note} · out of system`, figure: formatNumber(d.patients), tone: 'warn' })),
        doThis: { text: `${l.byFamily[0].family} is the biggest gap: ${l.byFamily[0].leftPct}% of those patients leave.`, label: 'Open leakage', action: 'openProfile', data: { id: entity.id, tab: 'leakage' }, add: entity.id },
        next: [`Top doctors at ${entity.name}`, 'Which accounts are growing the most?', 'Who should I see today?'],
      };
    }
    if (entity?.kind === 'hcp') return BUILDERS.referrals({ entity });
    const ranked = allOrgs().filter((o) => o.leakage && o.type !== 'Health system').sort((a, b) => b.leakage.leftPct - a.leakage.leftPct);
    const top = ranked[0];
    const lost = sum(ranked.map((o) => Math.round(o.leakage.patients * (o.leakage.leftPct / 100))));
    const referrer = hcpsAt(top.id).map((h) => ({ h, out: sum(h.referrals.outbound.filter((r) => r.ref).map((r) => r.count)) })).sort((a, b) => b.out - a.out)[0];
    return {
      scope: ['Patients who left the system', '2025', SAMPLE],
      summary: `${top.name} loses the most: ${top.leakage.leftPct}% of ${formatNumber(top.leakage.patients)} patients left. Across your accounts, about ${formatNumber(lost)} patients left the system.`,
      columns: ['Account', 'Left'],
      rows: ranked.map((o) => row(o, `${o.leakage.leftPct}%`, `${formatNumber(o.leakage.patients)} patients · biggest gap ${o.leakage.byFamily[0].family}`, { tone: o.leakage.leftPct >= 20 ? 'warn' : '', tab: 'leakage' })),
      doThis: referrer?.out
        ? { text: `${referrer.h.name} sends ${referrer.out} patients a year out of the system from ${top.name}. Start there.`, label: `Open ${referrer.h.name}`, action: 'openProfile', data: { id: referrer.h.id, tab: 'referrals' }, add: referrer.h.id }
        : { text: `${top.leakage.byFamily[0].family} is the biggest gap at ${top.name}.`, label: `Open ${top.name}`, action: 'openProfile', data: { id: top.id, tab: 'leakage' }, add: top.id },
      next: [`Where do patients at ${top.name} go?`, 'Which accounts are growing the most?', 'Who should I see today?'],
      about: top.id,
    };
  },

  referrals({ entity }) {
    if (entity?.kind !== 'hcp') {
      const ranked = allHcps().map((h) => ({ h, out: sum(h.referrals.outbound.filter((r) => r.ref).map((r) => r.count)) })).filter((r) => r.out).sort((a, b) => b.out - a.out);
      return {
        scope: ['Referrals out of the system', '2025', SAMPLE],
        summary: `${ranked[0].h.name} sends the most patients out of the system: ${ranked[0].out} in the 2025.`,
        columns: ['Doctor', 'Sent out'],
        rows: ranked.slice(0, 5).map(({ h, out }) => row(h, String(out), `${h.specialty} · ${primaryOrg(h).name}`, { tone: 'warn', tab: 'referrals' })),
        doThis: { text: `A visit to ${ranked[0].h.name} could keep the most patients in the system.`, label: `Open ${ranked[0].h.name}`, action: 'openProfile', data: { id: ranked[0].h.id, tab: 'referrals' }, add: ranked[0].h.id },
        next: [`Brief me on ${ranked[0].h.name}`, 'Where am I losing the most volume?'],
        about: ranked[0].h.id,
      };
    }
    const out = entity.referrals.outbound;
    if (!out.length) return empty(`${entity.name} doesn’t refer patients on in the sample data.`, entity.id);
    const total = sum(out.map((r) => r.count));
    const leaving = out.filter((r) => r.ref);
    const leftCount = sum(leaving.map((r) => r.count));
    const topOut = leaving.sort((a, b) => b.count - a.count)[0];
    return {
      scope: ['Referrals out', '2025', SAMPLE],
      summary: leftCount
        ? `${entity.name} referred ${total} patients on. ${leftCount} (${Math.round((leftCount / total) * 100)}%) went outside the system, ${leaving.length === 1 ? 'all' : `${topOut.count}`} to ${destination(topOut.ref).name}.`
        : `${entity.name} referred ${total} patients on, all within the system.`,
      columns: ['Referred to', 'Patients'],
      rows: [...out].sort((a, b) => b.count - a.count).map((r) => (r.hcpId
        ? row(getEntity(r.hcpId), String(r.count), `In system · ${r.reason}`, { tab: 'overview' })
        : { title: destination(r.ref).name, sub: `Out of system · ${r.reason}`, figure: String(r.count), tone: 'warn' })),
      doThis: topOut ? { text: `Ask why ${topOut.reason} patients go to ${destination(topOut.ref).name} instead of staying in the system.`, label: 'Open referrals', action: 'openProfile', data: { id: entity.id, tab: 'referrals' }, add: entity.id } : null,
      next: [`Brief me on ${entity.name}`, `Procedure mix for ${entity.name}`, 'Who should I see today?'],
    };
  },

  /** How one person or account is trending, family by family. */
  trend({ entity }) {
    const t = totals(entity);
    if (!t) return empty(`Procedure volumes aren’t available for ${entity.name}. ${entity.proceduresUnavailable || ''}`.trim(), entity.id);
    const families = proceduresOf(entity).map((r) => ({ r, prev: prev4(r.series), cur: last4(r.series) }))
      .map((f) => ({ ...f, pct: f.prev ? ((f.cur - f.prev) / f.prev) * 100 : 0 }))
      .sort((a, b) => Math.abs(b.cur - b.prev) - Math.abs(a.cur - a.prev));
    const mover = families[0];
    const direction = t.growth >= 1 ? 'up' : t.growth <= -1 ? 'down' : 'flat';
    return {
      scope: ['2025 vs the 12 before', SAMPLE],
      summary: `${entity.name} is ${direction === 'flat' ? 'flat' : direction} on last year: ${formatNumber(t.prev)} to ${formatNumber(t.cur)} procedures (${changeWords(t.growth)}). The biggest change is ${mover.r.family} (${changeWords(mover.pct)}).`,
      columns: ['Procedure', 'Change'],
      rows: families.map((f) => ({ title: f.r.family, sub: `${f.r.code} · ${formatNumber(f.cur)} in the 2025`, figure: '', change: f.pct })),
      doThis: { text: 'See the quarter-by-quarter trend before the visit.', label: 'Open volumes', action: 'openProfile', data: { id: entity.id, tab: 'volumes' }, add: entity.id },
      next: entity.kind === 'hcp'
        ? [`Where does ${entity.name} refer patients?`, `Brief me on ${entity.name}`, 'What has declined?']
        : [`Where do patients at ${entity.name} go?`, `Top doctors at ${entity.name}`, 'What has declined?'],
      about: entity.id,
    };
  },

  mix({ entity }) {
    const e = entity || (allOrgs()[0]||getOrg('msh'));
    const rows = proceduresOf(e);
    if (!rows) return empty(`Procedure volumes aren’t available for ${e.name}. ${e.proceduresUnavailable || ''}`.trim(), e.id);
    const total = sum(rows.map((r) => last4(r.series)));
    const sorted = [...rows].sort((a, b) => last4(b.series) - last4(a.series));
    return {
      scope: ['Procedures', '2025', SAMPLE],
      summary: `${sorted[0].family} is ${Math.round((last4(sorted[0].series) / total) * 100)}% of ${possessive(e.name)} ${formatNumber(total)} procedures in the 2025.`,
      columns: ['Procedure', 'Count'],
      rows: sorted.map((r) => ({ title: r.family, sub: r.code, figure: formatNumber(last4(r.series)), change: ((last4(r.series) - prev4(r.series)) / (prev4(r.series) || 1)) * 100 })),
      doThis: { text: 'Open the volumes tab for the quarter-by-quarter trend.', label: 'Open volumes', action: 'openProfile', data: { id: e.id, tab: 'volumes' }, add: e.id },
      next: [e.kind === 'hco' ? `Top doctors at ${e.name}` : `Brief me on ${e.name}`, 'Which accounts are growing the most?'],
      about: e.id,
    };
  },

  people({ entity }) {
    const org = entity?.kind === 'hco' ? entity : entity ? primaryOrg(entity) : (allOrgs()[0]||getOrg('msh'));
    const list = hcpsAt(org.id);
    if (!list.length) return empty(`Nobody in your book practices at ${org.name}.`, org.id);
    const top = list[0];
    return {
      scope: [`At ${org.name}`, 'Procedures, 2025', SAMPLE],

      columns: ['Doctor', 'Procedures'],
      rows: list.slice(0, 6).map((h) => row(h, procedureTotal(h) ? formatNumber(procedureTotal(h)) : 'Referrer', h.specialty)),
      doThis: { text: `See every HCP and the executives at ${org.name}.`, label: 'Open people', action: 'openProfile', data: { id: org.id, tab: 'people' }, add: top.id },
      next: [`Brief me on ${top.name}`, `Where do patients at ${org.name} go?`],
      about: org.id,
    };
  },

  followups({ ctx }) {
    const open = ctx.ws.followUps.filter((f) => !f.done).sort((a, b) => a.due.localeCompare(b.due));
    if (!open.length) return { scope: ['Your follow-ups'], summary: 'You have no open follow-ups.', rows: [], next: ['Who should I see today?'] };
    const overdue = open.filter((f) => daysBetween(ctx.today, fromIso(f.due)) < 0);
    const first = open[0];
    return {
      scope: ['Your follow-ups', 'On this device'],
      summary: `You have ${plural(open.length, 'open follow-up')}${overdue.length ? `, ${overdue.length} overdue` : ''}. Most urgent: “${first.text}” for ${getEntity(first.targetId).name}.`,
      columns: ['Follow-up', 'Due'],
      rows: open.map((f) => ({ id: f.targetId, title: f.text, sub: getEntity(f.targetId).name, figure: `Due ${relativeDay(f.due, ctx.today).toLowerCase()}`, tone: daysBetween(ctx.today, fromIso(f.due)) < 0 ? 'warn' : '', tab: 'activity' })),
      doThis: { text: 'Tick them off in Activity as you go.', label: 'Open Activity', action: 'tab', data: { tab: 'activity' } },
      next: ['Who should I see today?', 'What’s on my plan today?'],
      about: first.targetId,
    };
  },

  plan({ q, ctx }) {
    const day = /\btomorrow\b/.test(q) ? ctx.tomorrowIso : ctx.todayIso;
    const items = routeOrder(activeItems(ctx.ws.plans[day]));
    const name = ctx.dayWord(day);
    if (!items.length) {
      return {
        scope: [ctx.dayName(day)],
        summary: `Nothing is planned for ${name} yet.`,
        rows: [],
        doThis: { text: 'Pick a few people or accounts, then review them as one plan.', label: 'Plan the day', action: 'planYourDay', data: { day } },
        next: ['Who should I see today?', 'Who is near Mount Sinai West?'],
      };
    }
    const first = items.find((i) => i.status === 'planned') || items[0];
    return {
      scope: [ctx.dayName(day), plural(items.length, 'stop')],
      summary: `${plural(items.length, 'stop')} ${name}. ${first.status === 'planned' ? 'Next' : 'First'}: ${getEntity(first.targetId).name}${first.mode === 'timed' ? ` at ${first.time}` : ''}.`,
      columns: ['Stop', 'Time'],
      rows: items.map((i) => {
        const t = getEntity(i.targetId);
        return row(t, i.status === 'done' ? 'Done' : i.mode === 'timed' ? i.time : 'Any time', `${i.type} · ${siteFor(t, i.siteId).name}`, { tab: 'overview' });
      }),
      doThis: { text: 'Change times or add stops in one place.', label: 'Review plan', action: 'reviewPlan', data: { day } },
      next: [`Brief me on ${getEntity(first.targetId).name}`, 'Who should I see today?', 'What follow-ups are overdue?'],
      about: first.targetId,

  },

  suggest({ ctx }) {
    const picks = ctx.suggestions(ctx.todayIso, 5);
    if (!picks.length) return empty('Everyone suggested is already planned for today.');
    const top = picks[0];
    return {
      scope: ['Today', 'Follow-ups, leakage, volume and last contact'],
      summary: `Start with ${top.entity.name}: ${reasons(top.signals) || 'the highest volume in your book'}.`,
      columns: ['Target', 'Why'],
      rows: picks.map(({ entity: e, signals }) => row(e, '', signals.slice(0, 2).map((s) => s.label).join(' · ') || (e.kind === 'hcp' ? e.specialty : e.typeDetail))),

  near({ entity, ctx }) {
    const place = entity ? siteFor(entity) : null;

    const label = place ? place.name : `${REP.start.label} (your sample start point)`;
    const near = [...allHcps(), ...allOrgs()]
      .filter((e) => e.type !== 'Health system' && e.id !== place?.id && e.id !== entity?.id)
      .map((e) => ({ e, km: haversineKm(origin, siteFor(e).coords) }))
      .filter((r) => !ctx.planItemFor(r.e.id, ctx.todayIso))
      .sort((a, b) => a.km - b.km);
    const within = near.filter((r) => r.km <= 2);
    const top = near[0];
    if (!top) return empty(`Everyone near ${label} is already in today’s plan.`, entity?.id);

      scope: [`Near ${place ? place.name : REP.start.label}`, 'Straight-line distance', 'Not yet planned today'],

        ? `${plural(within.length, 'unplanned target')} within 2 km of ${label}. Closest: ${top.e.name}, ${formatKm(top.km)}.`

      rows: near.slice(0, 6).map(({ e, km }) => row(e, formatKm(km), e.kind === 'hcp' ? `${e.specialty} · ${siteFor(e).name}` : e.typeDetail)),
      doThis: { text: `Fit ${top.e.name} in while you’re nearby.`, label: `Open ${top.e.name}`, action: 'openProfile', data: { id: top.e.id }, add: top.e.id },
      next: ['Who should I see today?', 'What’s on my plan today?'],
      about: top.e.id,
      selectable: true,
    };
  },

  brief({ entity, ctx }) {
    if (!entity) return BUILDERS.search({ question: '', q: '', ctx });
    const last = ctx.lastInteraction(entity.id);
    const open = ctx.ws.followUps.filter((f) => !f.done && f.targetId === entity.id);
    const t = totals(entity);
    const planned = ctx.planItemFor(entity.id, ctx.todayIso);
    const facts = [
      { title: 'Last contact', figure: last ? relativeDay(last.date, ctx.today) : 'Never', sub: last ? `${last.type} · ${last.outcome}${last.note ? ` · “${last.note.slice(0, 70)}${last.note.length > 70 ? '…' : ''}”` : ''}` : 'No interactions logged yet' },
      { title: 'Open follow-ups', figure: String(open.length), sub: open[0] ? open[0].text : 'None', tone: open.length ? 'warn' : '' },
      t ? { title: 'Procedures · 2025', figure: formatNumber(t.cur), change: t.growth } : { title: 'Procedures', figure: '—', sub: 'Not in your code group' },
      entity.kind === 'hcp'
        ? { title: 'Referrals out of system', figure: String(sum(entity.referrals.outbound.filter((r) => r.ref).map((r) => r.count))), sub: 'Patients, 2025', tone: entity.leakageRisk ? 'warn' : '' }
        : { title: 'Patients leaving', figure: entity.leakage ? `${entity.leakage.leftPct}%` : '—', sub: entity.leakage ? `of ${formatNumber(entity.leakage.patients)} patients` : 'Not reported', tone: entity.leakage?.leftPct >= 20 ? 'warn' : '' },
    ];
    if (planned) facts.unshift({ title: 'In today’s plan', figure: planned.mode === 'timed' ? planned.time : 'Any time', sub: planned.goal || planned.type });
    const insight = entity.kind === 'hcp' ? entity.insight : entity.leakage?.insight || entity.leakageUnavailable;
    return {
      scope: [entity.kind === 'hcp' ? entity.specialty : entity.typeDetail, SAMPLE],
      summary: insight,
      columns: ['', ''],
      rows: facts,
      doThis: { text: 'Open the full profile to prepare.', label: entity.kind === 'hcp' ? 'Open profile' : 'Open account', action: 'openProfile', data: { id: entity.id }, add: entity.id },
      next: entity.kind === 'hcp'
        ? [`Where does ${entity.name} refer patients?`, `Procedure mix for ${entity.name}`, `Who is near ${siteFor(entity).name}?`]
        : [`Where do patients at ${entity.name} go?`, `Top doctors at ${entity.name}`],
      about: entity.id,
      title: entity.name,
    };
  },

  search({ question, q, ctx }) {
    const words = q.replace(/\b(show|find|me|the|a|an|for|of|in|at|who|what|is|are|my|please)\b/g, ' ').trim();
    const rows = words ? [...ctx.search({ ...ctx.ws.targets, query: words, kind: 'hcp', signals: [], specialty: '', orgType: '', distance: 'any', planned: 'any' }), ...ctx.search({ ...ctx.ws.targets, query: words, kind: 'hco', signals: [], specialty: '', orgType: '', distance: 'any', planned: 'any' })] : [];
    if (rows.length) {
      return {
        scope: ['Search', 'Your book'],
        summary: `I couldn’t answer that as a question, but ${plural(rows.length, 'target matches', 'targets match')} “${question.trim()}”.`,
        columns: ['Target', ''],
        rows: rows.slice(0, 6).map((r) => row(r.entity, '', r.entity.kind === 'hcp' ? `${r.entity.specialty} · ${siteFor(r.entity).name}` : r.entity.typeDetail)),
        next: STARTERS[2].questions.slice(0, 3),
        selectable: true,
      };
    }
    return {
      scope: ['Not understood'],
      summary: 'I can’t answer that yet. Try asking about growth, decline, leakage, referrals, your plan, follow-ups, or a person or account by name.',
      rows: [],
      next: [STARTERS[0].questions[0], STARTERS[1].questions[0], STARTERS[2].questions[0]],
      unknown: true,
    };
  },
};

      function hcoPage(){const e=byId(s.id),site=sites[e.id];return `${entityHeader(e)}${commonActions(e)}${tabs([['overview','Account overview'],['people','HCPs here'],['analysis','Analysis'],['activity','Activity']],s.hcoTab,'hcotab')}${s.hcoTab==='people'?`<div class="fp-gap"><h2>HCPs at this account</h2><p class="fp-small fp-muted">Ranked by claims in ${esc(s.group)} · 2025. Sample clinicians.</p><div class="fp-list">${allHcp.filter(p=>p.site===e.id&&(s.group==='All codes'||p.codes.includes(s.group))).map(p=>entityRow(p)).join('')}</div>${link('Explore HCPs near this account','near-site:'+e.id)}</div>`:s.hcoTab==='activity'?profileActivity(e):s.hcoTab==='analysis'?hcoAnalysis(e):`<div class="fp-metrics">${metric('Procedures',fmt(vol(e,s)),'↑ '+e.trend+'% vs 2024')}${metric('Left the account',(e.left/e.volume*100).toFixed(1)+'%',fmt(Math.round(e.left*factor(s)))+' of '+fmt(vol(e,s))+' · 2025')}</div>${prepCard(e)}<div class="fp-panel"><h2>Procedure mix</h2>${mix(e)}${link('All account analysis','hcotab:analysis')}</div><div class="fp-panel"><h2>Where the cases go</h2>${destinations(e)}${b('Generate leakage report','pro-report:'+e.id,'fp-full')}</div><div class="fp-panel"><div class="fp-flex fp-spread"><h2>Who to see here</h2>${link('All HCPs','hcotab:people')}</div>${allHcp.filter(p=>p.site===e.id).slice(0,2).map(p=>`<div class="fp-detail">${link(esc(p.name)+' '+icon('chevron-right'),'entity:'+p.id)}<div class="fp-small fp-muted">${esc(p.specialty)} · ${fmt(vol(p,s))} claims</div></div>`).join('')}</div>`}`;}
      function mix(e){const total=vol(e,s);if(!total)return '<p class="fp-small fp-muted">No sample claims in this code group for this HCP.</p>';const names=s.group==='All codes'?(e.kind==='hcp'?e.codes:['Hernia','Colectomy','Bariatric']):[s.group],codeLabels={Hernia:'CPT 49591',Colectomy:'CPT 44204',Bariatric:'CPT 43775'};let used=0;return names.map((name,i)=>{const n=i===names.length-1?total-used:vol(e,{...s,group:name});used+=n;return detail(name+' · '+codeLabels[name],fmt(n),`${(n/total*100).toFixed(1)}% · procedure claims · 2025`,n/total*100);}).join('');}
      function destinations(e){const total=Math.round(e.kind==='hco'?e.left*factor(s):vol(e,s)*.11),a=Math.round(total*.57);return detail('Other hospitals',fmt(a),'57% of cases leaving',57)+detail('Other outpatient facilities',fmt(total-a),'43% of cases leaving',43)+`<div class="fp-small fp-muted fp-gap">Sample destinations · ${esc(s.group)} · 2025. Counts are claims, not appointment availability.</div>`;}
      function hcoAnalysis(e){return `<div class="fp-metrics">${metric('Opportunity','$'+(e.opportunity*factor(s)).toFixed(1)+'M','Billed charges · 2025')}${metric('In-radius share',e.market+'%','Within 100 miles · 2025')}</div><details open><summary class="cursor-interaction">Procedure volume by year</summary><div class="fp-inside">${chart([Math.round(vol(e,s)*.82),Math.round(vol(e,s)/(1+e.trend/100)),vol(e,s)],['2023','2024','2025'])}</div></details><details><summary class="cursor-interaction">Leakage by quarter & destinations</summary><div class="fp-inside">${chart([10,11,9,Math.round(e.left/e.volume*100)],['Q1','Q2','Q3','Q4'],'percent leakage')}${destinations(e)}${link('Ask about leakage','ask:leakage')}</div></details><details><summary class="cursor-interaction">Capacity, profile & robotic-assist claims</summary><div class="fp-inside">${detail('Beds',fmt(e.beds),'Facility profile')}${detail('Operating rooms','Not available','No verified value in this sample')}${detail('Robotic-assist claims','268','S2900 · sample 2025')}${detail('Ownership','Nonprofit',e.parent)}</div></details><details><summary class="cursor-interaction">Payer mix & site of care</summary><div class="fp-inside">${detail('Commercial','48%','Claims by payer · 2025',48)}${detail('Medicare','37%','Claims by payer · 2025',37)}${detail('Other','15%','Claims by payer · 2025',15)}${detail('Outpatient','62%','Encounters by setting; separate denominator',62)}</div></details><details><summary class="cursor-interaction">Referrals in and out</summary><div class="fp-inside">${detail('Referrals in','1,240','2025 · selected procedure codes')}${detail('Referrals out','870','2025 · selected procedure codes')}${link('Explore referring HCPs','site-hcps:'+e.id)}</div></details><details><summary class="cursor-interaction">Case loss & facility finances</summary><div class="fp-inside">${detail('Case loss by MS-DRG','Not available','Not measured in the preview')}${detail('Facility finances','Not available','Cost report values are separate from selected-code claims')}<p class="fp-small fp-muted fp-gap">These remain named sections when the assigned FieldPro view supplies data.</p></div></details><details><summary class="cursor-interaction">Industry payments & research</summary><div class="fp-inside">${detail('Industry payments','$126,000','Sample Open Payments to affiliated HCPs · 2024')}${link('Open HCPs','hcotab:people')}</div></details>`;}
      function hcpPage(visitMode=false){const e=byId(s.id),v=visitMode?s.plan.find(v=>v.id===s.currentVisit):null;return `${visitMode?`<div class="fp-steps"><strong>Visit ${s.plan.filter(x=>x.status!=='cancelled').indexOf(v)+1} of ${s.plan.filter(x=>x.status!=='cancelled').length}</strong><span>·</span><span>${esc(v?.mode==='Appointment'?v.time:'Flexible stop')}</span>${link('Route','route')}</div>`:''}${entityHeader(e)}${visitMode?`<div class="fp-actions">${b(icon('notebook-pen')+' Log visit','log:'+e.id,'primary')}${b(icon('sparkles')+' Prepare','prep:'+e.id,'soft')}</div><div class="fp-flex fp-wrap">${link('Appointment','booking:'+e.id)}${link('Leakage report','report:'+e.id)}${link('Can’t meet / cancel','visit-options:'+e.id)}</div>`:commonActions(e)}${tabs([['overview','Overview'],['clinical','Clinical'],['referrals','Referrals'],['activity','Activity']],s.profileTab,'hcptab')}${s.profileTab==='activity'?profileActivity(e):s.profileTab==='clinical'?hcpClinical(e):s.profileTab==='referrals'?referrals(e):`<div class="fp-metrics">${metric('Claims',fmt(vol(e,s)),'↑ '+e.trend+'% vs 2024')}${metric('Last contact',s.notes.filter(n=>n.entity===e.id&&!n.deleted).length?stamp(s.notes.filter(n=>n.entity===e.id&&!n.deleted).sort((a,b)=>a.date.localeCompare(b.date)).at(-1).date):e.last,'See dated visit records')}</div>${prepCard(e)}<div class="fp-panel"><h2>At a glance</h2>${detail('Primary hospital',S(e.id).name,'New York · NY')}${detail('Practice','New York, NY '+S(e.id).zip,'Sample contact data')}${detail('Phone','(212) 555-0101','Office · sample')}${detail('Email',e.name.replace('Dr. ','').toLowerCase().replace(' ','.')+'@example.com','Sample contact')}${link('Open account','entity:'+e.site)}</div><details><summary class="cursor-interaction">When and where they work</summary><div class="fp-inside">${chart([12,23,19,31,15],['Mon','Tue','Wed','Thu','Fri'],'percent of visits')}<p class="fp-small fp-muted">Historical weekday visit share · 2025. This is not an appointment calendar.</p>${detail(S(e.id).name,'82%','Share of sample visits',82)}${detail('Other sites','18%','Share of sample visits',18)}</div></details><div class="fp-panel"><h2>Who else to see nearby</h2><p class="fp-small fp-muted">Same account or nearby facilities · no availability implied.</p>${allHcp.filter(p=>p.id!==e.id).sort((a,b)=>(a.site===e.site?-1:1)-(b.site===e.site?-1:1)).slice(0,2).map(p=>`<div class="fp-detail"><div>${link(esc(p.name),'entity:'+p.id)}</div><div class="fp-small fp-muted">${esc(S(p.id).name)} · ${fmt(vol(p,s))} claims</div>${link(s.selected.includes(p.id)?'Selected for route':'Add to route','select:'+p.id)}</div>`).join('')}${link('Explore all nearby HCPs','near-site:'+e.site)}</div><details><summary class="cursor-interaction">Industry payments, research & background</summary><div class="fp-inside">${detail('Industry payments','$24,800','Sample Open Payments · 2024')}${detail('Publications','12','Sample publications on file')}${detail('Clinical trials','2','Sample trial participation')}${detail('Training','General surgery','Background information')}</div></details>`}`;}
      function hcpClinical(e){return `<div class="fp-note">${esc(s.group)} · 2025 · procedure claims. Search and scope apply to the visible sample rows.</div><div class="fp-panel"><div class="fp-flex fp-spread"><h2>What they do</h2>${link('Ask','ask:clinical')}</div>${mix(e)}</div><details><summary class="cursor-interaction">Diagnoses · ICD-10</summary><div class="fp-inside">${detail('K40 · Inguinal hernia',fmt(Math.round(vol(e,s)*.52)),'Diagnosis claims · sample 2025')}${detail('K43 · Other hernia',fmt(Math.round(vol(e,s)*.25)),'Diagnosis claims · sample 2025')}</div></details><details><summary class="cursor-interaction">Prescribing · Rx</summary><div class="fp-inside"><p class="fp-small fp-muted">No prescribing data supplied for these selected procedure codes. A drug/code scope is required.</p></div></details><details><summary class="cursor-interaction">Payer claims</summary><div class="fp-inside">${detail('Commercial','51%','Procedure claims · 2025',51)}${detail('Medicare','34%','Procedure claims · 2025',34)}${detail('Other','15%','Procedure claims · 2025',15)}</div></details><div class="fp-panel"><h2>Volume trend</h2>${chart([Math.round(vol(e,s)*.81),Math.round(vol(e,s)/(1+e.trend/100)),vol(e,s)],['2023','2024','2025'])}</div>`;}
      function referrals(e){const mode=s.refMode||'dx',names=allHcp.filter(p=>p.id!==e.id).slice(0,3),base=mode==='dx'?116:84;return `<div class="fp-gap">${tabs([['dx','Diagnoses'],['px','Procedures']],mode,'refmode')}</div><div class="fp-note">${mode==='dx'?'Diagnosis':'Procedure'} referral sample · 2025 · counts per code, not unique patients.</div><div class="fp-panel"><div class="fp-flex fp-spread"><h2>Who sends them work</h2>${link('Ask','ask:referrals')}</div>${names.map((p,i)=>`<div class="fp-detail"><div class="fp-detail-top">${link(esc(p.name),'entity:'+p.id)}<span>${fmt(base-i*23)}</span></div><div class="fp-small fp-muted">${esc(p.specialty)} · ${mode==='dx'?'K40':'49591'} · ${esc(S(p.id).name)}</div></div>`).join('')}<p class="fp-small fp-muted fp-gap">Top 3 of ${mode==='dx'?48:32} sample referring HCPs.</p></div><div class="fp-panel"><h2>Where they send work</h2>${names.slice().reverse().map((p,i)=>`<div class="fp-detail">${link(esc(p.name),'entity:'+p.id)}<span style="float:right">${base-24-i*19}</span><small class="fp-muted" style="display:block">${esc(S(p.id).name)} · ${mode==='dx'?'Diagnoses':'Procedures'}</small></div>`).join('')}</div><div class="fp-panel"><h2>Where their cases go</h2>${destinations(e)}${link('Account leakage report','report:'+e.id)}</div>`;}
      function profileActivity(e){const ns=s.notes.filter(n=>!n.deleted&&(n.entity===e.id||(e.kind==='hco'&&byId(n.entity)?.site===e.id))).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="fp-gap"><div class="fp-flex fp-spread"><h2>Visits & follow-ups</h2>${link('Log visit','log:'+e.id)}</div>${s.followups.filter(f=>f.entity===e.id&&!f.done).map(f=>followRow(f)).join('')}${ns.length?ns.map(n=>noteCard(n)).join(''):'<div class="fp-empty">No visit records yet.</div>'}${s.bookings.filter(a=>a.entity===e.id).map(a=>bookingCard(a)).join('')}${link('All activity','activity')}</div>`;}
      function noteCard(n){return `<div class="fp-panel"><div class="fp-flex fp-spread"><strong style="font-weight:500">${esc(byId(n.entity).name)}</strong>${tag(n.outcome,'good')}</div><div class="fp-small fp-muted">${stamp(n.date)} · ${esc(n.type)} · ${esc(n.author||'You')}${n.edited?' · edited':''}</div><p class="fp-gap">${esc(n.text||'Outcome recorded without a written note.')}</p>${n.topic?tag(n.topic):''}<div class="fp-flex fp-wrap">${link('Open profile','entity:'+n.entity)}${link('Edit','edit-note:'+n.id)}${n.transcript?link('Transcript','transcript:'+n.id):''}${link('Ask about this visit','ask-note:'+n.id)}</div></div>`;}
      function followRow(f){return `<div class="fp-panel"><div class="fp-flex"><button type="button" class="fp-check cursor-interaction" data-act="follow-done:${f.id}" aria-label="${f.done?'Reopen':'Complete'} ${esc(f.text)}" aria-pressed="${f.done}">${icon(f.done?'check':'circle')}</button><div class="fp-grow"><strong style="font-size:13px;font-weight:500">${esc(f.text)}</strong><div class="fp-small fp-muted">${esc(byId(f.entity).name)} · ${stamp(f.due)}</div></div></div>${!f.done&&f.due<TODAY?tag('Overdue','warn'):''}${link('Open profile','entity:'+f.entity)}${link('Edit','edit-follow:'+f.id)}</div>`;}

      function territoriesPage(){return `<div class="fp-kicker">Your coverage</div><h1>My territories</h1><p class="fp-muted fp-small">Saved geography and assigned HCOs/HCPs. Available in Targets and Opportunity Map.</p>${b(icon('plus')+' Create territory','territory-new','primary fp-full')+b('↑ Upload ZIP codes','zip-upload','fp-full fp-gap')}<div class="fp-gap">${s.territories.map(t=>`<div class="fp-panel"><h2>${esc(t.name)}</h2><p class="fp-small fp-muted">${t.mode==='zips'?'ZIP codes':'States'} · ${esc(t.codes.join(', '))}</p><div class="fp-flex fp-wrap">${tag(Object.keys(s.membership).filter(id=>s.membership[id]===t.id&&byId(id)?.kind==='hco').length+' HCOs')}${tag(Object.keys(s.membership).filter(id=>s.membership[id]===t.id&&byId(id)?.kind==='hcp').length+' HCPs')}</div><div class="fp-flex fp-wrap fp-gap">${b('Open targets','territory-use:'+t.id,'primary')}${b('Explore map','territory-map:'+t.id)}${link('Edit coverage','territory-edit:'+t.id)}</div></div>`).join('')}</div>${!s.territories.length?'<div class="fp-empty">Create your first territory or find Someone new.</div>':''}`;}
      function grouped(plan){const out=[];plan.forEach(v=>{let last=out.at(-1);if(!last||last.site!==v.site){last={site:v.site,visits:[]};out.push(last);}last.visits.push(v);});return out;}
      function routePage(){const p=s.routeDraft||s.plan,active=p.filter(v=>!['cancelled','skipped'].includes(v.status));return `<div class="fp-kicker">${s.routeStarted?'Your day':'Review before starting'}</div><h1>${s.routeStarted?'Today’s route':'Plan your route'}</h1><p class="fp-small fp-muted">${stamp(s.routeDate)} · ${active.length} visits · ${new Set(active.map(v=>v.site)).size} facilities</p><div class="fp-flex fp-wrap">${b(icon('plus')+' Add stops','route-add')}${b(icon('settings-2')+' Date & start','route-settings')}${s.routeDraft?link('Discard changes','route-discard'):''}</div>${map('route')}<p class="fp-small fp-muted">Preview shows facility order only. Road routing and driving estimates are not connected.</p>${p.length?`<div class="fp-day">${grouped(p).map((g,i)=>`<div class="fp-stop"><div class="fp-flex fp-spread"><h3>${i+1}. ${esc(sites[g.site].name)}</h3><span class="fp-small fp-muted">${g.visits.length} visit${g.visits.length===1?'':'s'}</span></div>${g.visits.map(v=>`<div class="fp-routeitem"><div class="fp-flex"><button class="fp-row-main cursor-interaction" data-act="entity:${v.entity}"><strong>${esc(byId(v.entity).name)}</strong><small>${v.status==='done'?'Completed':v.status==='cancelled'?'Cancelled':v.status==='skipped'?'Skipped':v.mode==='Appointment'?esc(v.time)+' · appointment':'Flexible visit'} · ${v.duration} min</small></button><div class="fp-order">${ib('arrow-up','move-up:'+v.id,'Move '+byId(v.entity).name+' earlier')}${ib('arrow-down','move-down:'+v.id,'Move '+byId(v.entity).name+' later')}</div></div>${v.goal?`<p class="fp-small fp-muted fp-gap">${esc(v.goal)}</p>`:''}<div class="fp-flex fp-wrap">${link('Edit','stop-edit:'+v.id)}${link('Remove','stop-remove:'+v.id)}${link('Book time','booking:'+v.entity)}</div></div>`).join('')}</div>`).join('')}</div>`:'<div class="fp-empty">No visits selected yet.</div>'}${s.returnOrigin?'<div class="fp-note">Return to the starting point is selected.</div>':''}${s.routeStarted?b('Day recap','recap','fp-full'):''}`;}
      function visitPage(){const v=s.plan.find(v=>v.id===s.currentVisit);if(!v)return '<div class="fp-empty">No remaining visits.</div>';s.id=v.entity;return byId(v.entity).kind==='hco'?`<div class="fp-steps">Current account visit · ${s.plan.filter(x=>x.status!=='cancelled').indexOf(v)+1} of ${s.plan.filter(x=>x.status!=='cancelled').length}</div>${hcoPage()}`:hcpPage(true);}
      function recap(){const done=s.plan.filter(v=>v.status==='done'),skipped=s.plan.filter(v=>['skipped','cancelled'].includes(v.status)),remaining=s.plan.filter(v=>v.status==='planned'),missing=done.filter(v=>!s.notes.some(n=>n.visit===v.id&&!n.deleted));return `<div class="fp-kicker">${stamp(s.routeDate)} · Your visits</div><h1>Summary</h1><div class="fp-metrics">${metric('Completed',done.length+' / '+s.plan.filter(v=>v.status!=='cancelled').length,'Separate visit records')}${metric('Follow-ups',s.followups.filter(f=>!f.done).length,'Open tasks')}</div>${missing.length?`<div class="fp-note warn">${missing.length} completed visit${missing.length===1?' has':'s have'} no record yet.${missing.map(v=>link('Log '+esc(byId(v.entity).name),'log:'+v.entity)).join('')}</div>`:''}<div class="fp-panel"><h2>Completed</h2>${done.length?done.map(v=>`<div class="fp-detail">${link(esc(byId(v.entity).name),'entity:'+v.entity)}${s.notes.find(n=>n.visit===v.id&&!n.deleted)?tag('Record saved','good'):tag('No visit record','warn')}</div>`).join(''):'<p class="fp-small fp-muted">No completed visits yet.</p>'}</div>${remaining.length?`<div class="fp-panel"><h2>Remaining</h2>${remaining.map(v=>`<div class="fp-detail">${link(esc(byId(v.entity).name),'resume:'+v.id)}</div>`).join('')}${b('Continue visits','resume','fp-full')}</div>`:''}${skipped.length?`<div class="fp-panel"><h2>Skipped / cancelled</h2>${skipped.map(v=>`<div class="fp-detail"><span>${esc(byId(v.entity).name)}</span>${link('Restore visit','restore-visit:'+v.id)}</div>`).join('')}</div>`:''}<div class="fp-actions">${b('Visit records','activity')}${b('Copy recap','copy-recap')}</div>${s.bookings.length?'<h2 class="fp-gap">Appointments</h2>'+s.bookings.map(bookingCard).join(''):''}${b('Plan tomorrow','plan-tomorrow','primary fp-full fp-gap')+b(design==='opportunity'?'Back to targets':'Back to Field','home:targets','fp-full fp-gap')}`;}
      function activity(){const notes=s.notes.filter(n=>!n.deleted&&(!s.historyQuery||[n.text,byId(n.entity).name,n.topic].join(' ').toLowerCase().includes(s.historyQuery.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="fp-kicker">Your work, in context</div><h1>Activity</h1>${tabs([['todo','To do'],['records','Visit records']],s.activityTab,'activity-tab')}<div class="fp-flex fp-wrap fp-gap">${b(icon('plus')+' Follow-up','follow-new')}${b(icon('notebook-pen')+' Log visit','log:p1')}</div>${Object.keys(s.drafts).length?`<div class="fp-note">${Object.keys(s.drafts).length} unsaved visit draft${Object.keys(s.drafts).map(id=>link('Resume '+esc(byId(id).name),'log:'+id)).join('')}</div>`:''}${s.activityTab==='todo'?`<h2 class="fp-gap">${s.followups.filter(f=>!f.done&&f.due<TODAY).length?'Overdue and upcoming':'Open follow-ups'}</h2>${s.followups.filter(f=>!f.done).map(followRow).join('')||'<div class="fp-empty">You’re up to date.</div>'}${s.followups.some(f=>f.done)?`<details><summary class="cursor-interaction">Completed follow-ups</summary><div class="fp-inside">${s.followups.filter(f=>f.done).map(followRow).join('')}</div></details>`:''}`:`<div class="fp-searchrow"><label class="fp-search">${icon('search')}<input name="historyQuery" placeholder="Search visits or notes" aria-label="Search visit records" value="${esc(s.historyQuery)}"></label></div><div class="fp-kicker fp-gap">October 2026</div>${notes.map(noteCard).join('')||'<div class="fp-empty">No matching visit records.</div>'}${s.bookings.map(bookingCard).join('')}`}`;}
      function reports(){const rows=s.reports.filter(r=>s.reportsTab==='shared'?r.shared:!r.shared);return `<div class="fp-kicker">Account intelligence</div><h1>Reports</h1><p class="fp-small fp-muted">The same leakage reports you open from account pages and visits.</p>${tabs([['mine','My reports'],['shared','Shared with me']],s.reportsTab,'reports-tab')}<div class="fp-gap">${rows.map(r=>`<div class="fp-panel"><div class="fp-flex"><span class="fp-initial">${icon('file-chart-column')}</span><button class="fp-row-main cursor-interaction" data-act="report-view:${r.id}"><strong>${esc(sites[r.entity].name)}</strong><small>${esc(r.group)} · ${stamp(r.date)}${r.shared?' · Shared by Jordan Lee':''} · ${r.status==='ready'?'PDF':r.status==='failed'?'Generation failed':'Preparing PDF'}</small></button>${tag(r.status==='ready'?'Ready':r.status==='failed'?'Failed':'Generating',r.status==='ready'?'good':r.status==='failed'?'warn':'blue')}</div>${r.status==='generating'?'<span class="fp-meter"><span style="width:62%"></span></span>':''}${link(r.status==='generating'?'View progress':'Open report','report-view:'+r.id)}</div>`).join('')||'<div class="fp-empty">No reports in this view.</div>'}</div>${link('Find an account to report on','home:targets')}`;}
      function reportViewer(){const r=s.reports.find(r=>r.id===s.reportId);if(!r)return '<div class="fp-empty">Report not found.</div>';const e=byId(r.entity);if(r.status==='generating')return `<div class="fp-panel"><div class="fp-kicker">${esc(e.name)}</div><h1>Generating report</h1><p class="fp-muted">Preparing leakage analysis and the PDF.</p><span class="fp-meter"><span style="width:62%"></span></span><p class="fp-small fp-muted fp-gap">${esc(r.group)} · ${r.radius} miles · sample job</p>${b('Keep working','back','fp-full')}${link('Preview completed report','report-ready:'+r.id)}</div>`;if(r.status==='failed')return `<div class="fp-panel"><h1>Report unavailable</h1><p class="fp-muted">We couldn’t complete this preview.</p>${b('Retry','report-retry:'+r.id,'primary fp-full')}${link('All reports','reports')}</div>`;return `<div class="fp-flex fp-wrap">${b(icon('sparkles')+' Ask about report','ask-report:'+r.id,'soft')}${b(icon('share-2')+' Share','share-report:'+r.id)}${b(icon('download')+' Download','export-report:'+r.id)}</div><article class="fp-paper"><div class="fp-kicker">DocNexus · Leakage report preview</div><h1>${esc(e.name)}</h1><p class="fp-small fp-muted">${esc(r.group)} · 2025 · ${r.radius}-mile comparison</p><h2>Account overview</h2><p class="fp-small">Illustrative report. All figures below are fictional.</p>${detail('Procedure claims',fmt(vol(e,{...s,group:r.group})),'Selected-code claims · 2025')}${detail('Left the account',(e.left/e.volume*100).toFixed(1)+'%','Separate from appointment activity')}<h2>Where the cases go</h2>${detail('Other hospitals','57%','Share of sample cases leaving',57)}${detail('Other outpatient facilities','43%','Share of sample cases leaving',43)}<h2>Conversation starters</h2><p class="fp-small">Review the leading destinations, validate referral context, and agree on a specific next step. Claims patterns do not establish the cause of a referral.</p><h2>Scope & evidence</h2><p class="fp-small">${esc(r.group)} · individual faci       function askScreen(){const c=s.askContext,entity=c.kind==='report'?sites[s.reports.find(r=>r.id===c.id)?.entity]:byId(c.id);return `<div class="fp-flex fp-spread"><h1>Ask</h1>${link('New chat','ask-new')}</div><div class="fp-note">${icon('sparkles')} ${esc(entity?.name||getScope(s))} · ${esc(c.group||s.group)} · ${c.kind==='day'?'today’s route':'2025 data'}${c.visit?' · current visit':''}</div>${!s.messages.length?`<p class="fp-muted">Ask a question, prepare for a visit, or tell me what you want to do.</p><div class="fp-stack fp-gap">${b('Who should I see in this territory?','prompt:Who should I see in this territory?')}${b('Prepare me for Dr. Maya Patel','prompt:Prepare me for Dr. Maya Patel')}${b('Find nearby HCPs to fill a cancelled visit','prompt:Find nearby HCPs to fill a cancelled visit')}${b('Explain this account’s leakage','prompt:Explain this account’s leakage')}</div>`:''}<div class="fp-chat">${s.messages.map(m=>`<div class="fp-message ${m.role==='user'?'user':''}">${m.role==='user'?esc(m.text):m.html+(m.context?'<div class="fp-small fp-muted fp-gap">'+esc(m.context)+'</div>':'')}</div>`).join('')}</div><div class="fp-small fp-muted">Scripted conversation preview · no live AI or microphone.</div>`;}
      function sendAsk(){const q=s.askText.trim();if(!q)return;if(prefs.offline){toast('Offline preview: your question is kept. Reconnect to ask.');return;}s.messages.push({role:'user',text:q});let e=byId(s.askContext.id)||byId('p1');const named=allHcp.find(p=>q.toLowerCase().includes(p.name.replace('Dr. ','').toLowerCase()));if(named){e=named;s.askContext={...s.askContext,kind:'entity',id:e.id};}const lower=q.toLowerCase();let html;if(s.askContext.kind==='interaction'){const n=s.notes.find(n=>n.id===s.askContext.interaction)||s.notes.filter(n=>n.entity===e.id&&!n.deleted).sort((a,b)=>a.date.localeCompare(b.date)).at(-1);html=`<p><strong>${esc(e.name)} · ${n?stamp(n.date):'visit record'}</strong></p><p>${esc(n?.text||'No written note was saved.')}</p><p>Review any promised next step before your next contact.</p>${b('Open visit records','activity-records','soft')}${b('Add a follow-up','follow-entity:'+e.id)}`;}else if(s.askContext.kind==='report'){const r=s.reports.find(r=>r.id===s.askContext.id),h=byId(r?.entity||'msh');html=`<p><strong>${esc(h.name)}</strong> has ${(h.left/h.volume*100).toFixed(1)}% sample leakage in the report’s 2025 scope. The largest destination category is other hospitals.</p><p class="fp-small fp-muted">This describes claims movement, not why a specific patient moved.</p>${b('Open report evidence','report-view:'+r.id,'soft')}`;}else if(/prepare|brief|open with/.test(lower)){html=`<p><strong>For ${esc(e.name)}</strong></p><p>Open with ${e.kind==='hcp'?esc(e.goal.toLowerCase()):'the leading leakage destinations and the account’s procedure trend.'}</p><p>Review the most recent note${s.notes.some(n=>n.entity===e.id)?' and the requested follow-up brief':''}. Ask which next step would be useful before proposing one.</p>${b('Use this visit brief','apply-prep:'+e.id,'primary')}${link('See source profile','entity:'+e.id)}`;s.prepProposal={entity:e.id,text:e.goal||'Review leakage destinations and agree on a specific next step.'};}else if(/cancel|near|re       function jumpTo(key){requestAnimationFrame(()=>{const target=app.querySelector('#'+design+'-'+key),main=app.querySelector('.fp-main');if(target&&main)main.scrollTo({top:target.offsetTop-main.offsetTop-8,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});}
      function openAIEntity(id,tab){if(!byId(id))return;s.mixSearch='';go(byId(id).kind==='hco'?'hco':'hcp',id);const key={volumes:'mix',leakage:'quarter',people:'people',referrals:'referrals',activity:'history',overview:'brief'}[tab]||'brief';if(byId(id).kind==='hco'&&tab==='people'){s.hcoTab='people';render();}else jumpTo(key);}
      function sourceLiveAct(action){const [a,...r]=action.split(':'),id=r.join(':');
        if(a==='profile-map'&&byId(id)?.kind==='hco'){open('account-map',{entity:id,lens:'opportunity'});return true;}if(a==='account-map-lens'){s.sheet.d.lens=id;render();return true;}if(a==='pin'&&s.sheet?.kind==='account-map'){s.sheet.d.pin=id;render();return true;}if(a==='remove-target'){const before=s.membership[id];delete s.membership[id];toast('Removed from territory. Route selection is kept.',()=>s.membership[id]=before);save();return true;}if(a==='ensure-add'){if(!s.selected.includes(id))act('select:'+id);else toast('Already in your route selection');return true;}if(a==='pdf-open'){go('report-doc');return true;}if(a==='report-stop-watch'){back();toast('Stopped watching. The report may still finish in Reports.');return true;}if(a==='provider-record'){open('provider-record',{entity:id});return true;}if(a==='entity'){s.mixSearch='';return false;}if(a==='select'&&byId(id)?.kind==='hco'){open('pick-hcps',{entity:id});return true;}

        if(a==='add-targets'){s.source='new';s.view='explore';s.query='';open('filters',{near:s.near,origin:s.origin,radius:s.radius,geoState:s.geoState,city:s.city,group:s.group,type:s.type,specialty:s.specialty,sort:s.sort});return true;}
        if(a==='near-toggle'){s.near=!s.near;render();save();return true;}if(a==='territory-from-search'){open('territory',{name:s.geoState+' territory',mode:'states',codes:[s.geoState],zips:''});return true;}
        if(a==='field-start'){if(s.routeDraft)act('route-save');if(!s.routeDraft)act('start');return true;}if(a==='field-step'){if(id==='Scope')open('scope');else if(id==='Plan'){s.nav='targets';go('targets');}else if(id==='Route')go('route');else if(id==='Work')act('resume:'+s.currentVisit);else go('recap');return true;}
        if(a==='origin-use'){if(!s.routeStart?.trim()){toast('Enter a starting address or city.');return true;}s.routeOrigin=s.routeStart;toast('Starting point set for this preview');save();return true;}if(a==='origin-sample'){s.routeOrigin='Columbus Circle, New York';s.routeStart=s.routeOrigin;toast('Using the sample start location');save();return true;}
        if(a==='facility-up'||a==='facility-down'){if(!s.routeDraft)s.routeDraft=copy(s.plan);const gs=grouped(s.routeDraft),i=gs.findIndex(g=>g.site===id),j=i+(a==='facility-up'?-1:1);if(j>=0&&j<gs.length){[gs[i],gs[j]]=[gs[j],gs[i]];s.routeDraft=gs.flatMap(g=>g.visits);}render();save();return true;}
        if(a==='run-sheet'){open('run-sheet');return true;}if(a==='call'){const v=s.plan.find(v=>v.id===id);s.currentVisit=id;s.id=v.entity;s.sheet=null;s.screen='visit';live.preTab='overview';render(false);save();return true;}
        if(a==='back-call'){const arr=s.plan.filter(v=>v.status!=='cancelled'),i=arr.findIndex(v=>v.id===s.currentVisit);if(i>0)liveAct('call:'+arr[i-1].id);return true;}
        if(a==='pretab'){live.preTab=id;s.preReadTab=id;render(false);save();return true;}if(a==='done-next'||a==='skip-visit'){live.preTab='overview';s.preReadTab='overview';return false;}
        if(a==='full-profile'){openAIEntity(id,'overview');return true;}if(a==='full-network'){openAIEntity(id,'referrals');return true;}
        if(a==='replace-direct'){const v=s.plan.find(v=>v.id===s.currentVisit)||s.plan.find(v=>v.status==='planned');if(v){s.currentVisit=v.id;act('replace');}else toast('Start a route to choose a replacement.');return true;}
        if(a==='weekday'){live.week=id;render();return true;}if(a==='calendar-day'){open('export',{title:'Hospital activity',subtitle:'Historical claim-volume preview, not availability.',text:`${live.month+1}/${id}/${live.year} · ${S(s.id).name}\nTypical weekday activity in the selected sample.`});return true;}

        if(a==='log'){openLog(id);s.sheet.d.outcome=s.sheet.d.outcome||'Met';render();return true;}if(a==='note-type'){s.sheet.d.type=id;render();return true;}
        if(a==='field-save-note'){if(!s.sheet.d.text.trim()){s.sheet.error='Add or dictate a note first.';render();return true;}saveNote(false);return true;}
        if(a==='booking-length'){s.sheet.d.duration=Number(id);render();return true;}
        if(a==='pro-report'){const running=s.reports.find(r=>r.status==='generating');if(running){s.reportId=running.id;go('report');return true;}const e=byId(id),report={id:'r'+Date.now(),entity:id,group:s.group,title:e.name+' · '+s.group,radius:'100',date:TODAY,status:'generating',shared:false};s.reports.push(report);s.reportId=report.id;go('report');setTimeout(()=>{report.status=prefs.reportMode==='Report fails'?'failed':'ready';if(['report','reports'].includes(s.screen))render();save();},2200);save();return true;}
        if(a==='profile-export'||a==='target-export'){const e=byId(id);open('export',{title:'Export data',subtitle:'Export preview of the current scope.',text:e?e.name+' · '+s.group+' · 2025\nProcedure claims: '+fmt(vol(e,s)):scoped(s).map(e=>e.name+' · '+fmt(vol(e,s))).join('\n')});return true;}
        if(a==='contact'){open('export',{title:'Contact details',subtitle:'Illustrative professional contact information.',text:byId(id).name+'\n(212) 555-0101\n'+S(id).name});return true;}
        if(a==='email'){const e=byId(id);open('email',{entity:id,to:e.name.replace('Dr. ','').toLowerCase().replace(' ','.')+'@example.com',subject:'Follow-up discussion · '+s.group,body:`Hello ${e.name.replace('Dr. ','')},\n\n${s.prep[id]||e.goal}\n\nWould a brief discussion on this be useful?\n\nAlex`});return true;}
        if(a==='email-copy'){open('export',{title:'Copy email draft',text:s.sheet.d.subject+'\n\n'+s.sheet.d.body});return true;}
        if(a==='zip-upload'){open('csv',{name:'',csv:''});return true;}if(a==='zip-sample'){s.sheet.d.csv='territory,zip\nManhattan North,10019\nManhattan North,10029';s.sheet.d.name='Manhattan North';render();return true;}if(a==='zip-review'){const d=s.sheet.d,zips=d.csv.match(/\b\d{5}\b/g)||[];if(!d.name.trim()||!zips.length){s.sheet.error='Provide a territory name and valid ZIP codes.';render();return true;}open('territory',{name:d.name,mode:'zips',codes:[],zips:[...new Set(zips)].join(', ')});return true;}
        if(a==='prompt'){s.askText=id;sendAsk();return true;}if(a==='ask-send'){sendAsk();return true;}if(a==='filters'){return false;}if(a==='filter-reset'){Object.assign(s.sheet.d,{targetState:'all',targetCity:'all'});s.targetState='all';s.targetCity='all';return false;}if(a==='ask-clear'||a==='ask-new'){s.turns=[];live.about=null;render();save();return true;}
        if(a==='ai-open'){const parts=id.split(':');openAIEntity(parts[0],parts[1]);return true;}if(a==='ai-do'){const turn=s.turns[Number(id)],d=turn?.result?.doThis;if(!d)return true;if(d.action==='openProfile')openAIEntity(d.data.id,d.data.tab);else if(d.action==='command')act(d.data.command);else if(d.action==='report'){s.reportId=d.data.id;go('report');}else if(d.action==='tab'){s.activityTab='records';go('activity');}else go('route');return true;}

        if(kind==='territory')return workspaceSheet(d.edit?'Edit territory':'New territory',`${field('Name','name',d.name)}${select('Coverage','mode',d.mode,[['states','States'],['zips','ZIP codes']])}${d.mode==='zips'?field('ZIP codes','zips',d.zips||'','text','placeholder="10019, 10029"'):`<div class="fp-kicker fp-gap">States</div><div class="fp-stategrid">${stateCodes.map(c=>`<button class="fp-pill cursor-interaction" data-act="state:${c}" aria-pressed="${d.codes.includes(c)}">${c}</button>`).join('')}</div>`}`,b('Cancel','scope')+b(d.edit?'Save territory':'Create territory','territory-save','primary'));
        return baseTerritorySheet(kind,d);
      }
      function liveAct(action){const [a,...r]=action.split(':'),id=r.join(':');if(a==='replace-direct'){s.view='explore';return baseTerritoryAct(action);}if(a==='scope'||a==='territories'){open('scope',{scopeQuery:''});return true;}if(a==='specialty-picker'||a==='all-codes'){open('specialties');return true;}if(a==='cohort-codes'){open('cohort',{codeQuery:''});return true;}if(a==='group'){s.group=id;s.prep={};s.sheet=null;s.pin=null;render();save();return true;}if(a==='browse-mode'){s.view=id;s.source='territories';s.pin=null;render();save();return true;}if(a==='browse-kind'){s.kind=id;s.pin=null;render();save();return true;}if(a==='workspace-clear'){s.query='';render();save();return true;}if(a==='workspace-ask'){const q=s.query.trim();s.query='';ask('scope',null,q);return true;}if(a==='unified-search'){app.querySelector('[name=workspaceQuery]')?.focus();return true;}if(a==='territory-new'){open('territory',{name:'',mode:'states',codes:[],zips:''});return true;}if(a==='territory-use'||a==='territory-map'){s.source='territories';s.territory=id;s.query='';s.pin=null;s.nearContext=null;s.sheet=null;if(a==='territory-map'){s.nav='map';s.screen='map';}render(false);save();return true;}if(a==='territory-save'){const d=s.sheet.d,codes=d.mode==='states'?d.codes:[...new Set((d.zips||'').split(/[\s,]+/).filter(Boolean))];if(!d.name.trim()||!codes.length||d.mode==='zips'&&codes.some(c=>!/^\d{5}$/.test(c))){s.sheet.error='Enter a name and valid coverage.';render();return true;}if(s.territories.some(t=>t.id!==d.edit&&t.name.toLowerCase()===d.name.trim().toLowerCase())){s.sheet.error='That territory name already exists.';render();return true;}const t={id:d.edit||'t'+Date.now(),name:d.name.trim(),mode:d.mode,codes,areas:Object.keys(sites).filter(k=>d.mode==='states'?codes.includes('NY'):codes.includes(sites[k].zip))};if(d.edit)s.territories[s.territories.findIndex(x=>x.id===d.edit)]=t;else s.territories.push(t);if(d.assignment){open('assign',{...d.assignment,target:t.id});}else{s.territory=t.id;s.source='territories';if(!d.edit)s.view='explore';s.sheet=null;s.query='';render();}save();return true;}if(a==='assign-save'){const d=s.sheet.d;if(!d.target){s.sheet.error='Choose a territory.';render();return true;}const previous=copy(s.membership),extras=copy(s.additionalTerritories||{});(d.ids||[d.entity]).forEach(key=>{if(!s.membership[key])s.membership[key]=d.target;else if(s.membership[key]!==d.target)s.additionalTerritories={...s.additionalTerritories,[key]:[...new Set([...(s.additionalTerritories?.[key]||[]),d.target])]};});s.sheet=null;toast('Territory assignment saved',()=>{s.membership=previous;s.additionalTerritories=extras;});save();return true;}if(a==='remove-target'){const previous=s.membership[id],extras=copy(s.additionalTerritories?.[id]||[]),current=inTerritory(s,id,s.territory)?s.territory:previous;let remaining=[...new Set([previous,...extras].filter(t=>t&&t!==current))];if(remaining.length)s.membership[id]=remaining.shift();else delete s.membership[id];s.additionalTerritories={...s.additionalTerritories,[id]:remaining};s.sheet=null;toast('Removed from territory',()=>{if(previous)s.membership[id]=previous;else delete s.membership[id];s.additionalTerritories={...s.additionalTerritories,[id]:extras};});save();return true;}if(a==='quick-target'){const previous=s.membership[id],extras=copy(s.additionalTerritories?.[id]||[]);if(!previous)s.membership[id]=s.territory;else if(previous!==s.territory)s.additionalTerritories={...s.additionalTerritories,[id]:[...new Set([...extras,s.territory])]};toast('Added to '+getScope({...s,source:'territories'}),()=>{if(previous)s.membership[id]=previous;else delete s.membership[id];s.additionalTerritories={...s.additionalTerritories,[id]:extras};});save();return true;}if(a==='add-targets'){s.source='territories';s.view='explore';s.sheet=null;render();save();return true;}return baseTerritoryAct(action);}
      app.addEventListener('input',e=>{const el=e.target;if(el.name==='workspaceQuery'){s.query=el.value;render();}if((s.sheet?.kind==='scope'&&el.name==='scopeQuery')||(s.sheet?.kind==='cohort'&&el.name==='codeQuery'))render();});
      app.addEventListener('keydown',e=>{if(e.target.name==='workspaceQuery'&&e.key==='Enter'){e.preventDefault();if(s.query.trim()&&contextEngine().engine.looksLikeQuestion(s.query))liveAct('workspace-ask');}});
      app.addEventListener('toggle',e=>{if(e.target.matches('.territory-snapshot')&&app.contains(e.target)&&Boolean(s.snapshotOpen)!==e.target.open){s.snapshotOpen=e.target.open;save();}},true);

      render();const observer=new ResizeObserver(()=>app.querySelectorAll('[data-map]').forEach(el=>paintMap(el,s)));observer.observe(app);
      if(globalThis.Tweak){const t=new Tweak({container:app,onChange:()=>{s.offline=prefs.offline;render();}});t.addToggle(prefs,'dark',{label:'Dark appearance'});t.addSlider(prefs,'radius',{label:'Phone frame corners',min:12,max:38,unit:'px'});t.addToggle(prefs,'offline',{label:'Offline preview'});t.addSelect(prefs,'reportMode',{label:'Report preview',options:['Normal','Report fails']});}
      instances.push({reset:()=>{s=makeInitial();live.preTab='overview';live.about=null;live.voice='idle';live.handsFree=false;states[design]=s;render(false);save();},restore:r=>{s={...makeInitial(),...r,sheet:null,stack:[],notice:'',undo:null};states[design]=s;render();},design});
    }
    root.querySelectorAll('.fp-phone').forEach(makeApp);root.querySelector('[data-preview-reset]').addEventListener('click',()=>instances.forEach(i=>i.reset()));
    window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(p?.schema!==8||p?.sessionKey===sessionKey||!p?.variants)return;instances.forEach(i=>{if(p.variants[i.design])i.restore(p.variants[i.design]);});});
  })();
  </script>
