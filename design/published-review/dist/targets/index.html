  &lt;style&gt;
    #field-live-workflow{font-family:Inter,Arial,sans-serif;color:light-dark(#182035,#ecf0fa)}
    #field-live-workflow .fp-preview-caption{text-align:center;font-size:12px;padding:4px 12px 12px;color:light-dark(#586277,#b2bdd1)}
    #field-live-workflow .fp-stage{min-height:862px;padding:16px 12px 22px;display:flex;justify-content:center;align-items:flex-start;box-sizing:border-box}
    #field-live-workflow .fp-phone{--fp-bg:light-dark(#f4f6fa,#151c2b);--fp-paper:light-dark(#ffffff,#202a3c);--fp-ink:light-dark(#101727,#f0f3fc);--fp-muted:light-dark(#5b6478,#b4bfd2);--fp-line:light-dark(#dde3ef,#39455c);--fp-soft:light-dark(#e9edf6,#2d3951);--fp-blue:#2b49d3;--fp-blue-soft:light-dark(#e9edff,#2b3c67);--fp-onblue:#fff;--fp-good:light-dark(#147351,#84d7b4);--fp-warn:light-dark(#a3451d,#ffba94);--fp-warn-bg:light-dark(#fff0e6,#483429);--fp-water:light-dark(#dce7ec,#263b4c);--fp-land:light-dark(#f0eee6,#36443d);--fp-park:light-dark(#cfddbd,#405b45);--fp-road:light-dark(#fafaf5,#829083);color-scheme:light;position:relative;isolation:isolate;background:var(--fp-bg);color:var(--fp-ink);border:1px solid var(--fp-line);border-radius:32px;width:100%;max-width:414px;height:824px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 14px 38px #0f234c14;font:14px/1.5 Inter,Arial,sans-serif;letter-spacing:-.015em}
    #field-live-workflow .fp-phone *{box-sizing:border-box}
    #field-live-workflow button,#field-live-workflow input,#field-live-workflow select,#field-live-workflow textarea{font:inherit;color:inherit;max-width:100%}
    #field-live-workflow button{background:none;border:0;text-align:left}
    #field-live-workflow button:disabled{opacity:.45}
    #field-live-workflow button:focus-visible,#field-live-workflow input:focus-visible,#field-live-workflow select:focus-visible,#field-live-workflow textarea:focus-visible{outline:3px solid var(--fp-blue);outline-offset:2px}
    #field-live-workflow svg[data-lucide]{width:18px;height:18px;flex-shrink:0;stroke-width:1.8;vertical-align:middle}
    #field-live-workflow .fp-status{padding:11px 23px 2px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;min-height:30px}
    #field-live-workflow .fp-status span:last-child{display:flex;align-items:center;gap:5px}
    #field-live-workflow .fp-status svg{width:15px;height:15px}
    #field-live-workflow .fp-header{padding:12px 18px;display:flex;gap:8px;align-items:center;min-height:67px;background:var(--fp-bg)}
    #field-live-workflow .fp-brand{font-size:25px;font-weight:700;letter-spacing:-1.2px;display:flex;align-items:center;gap:8px;padding:0;flex:1;min-width:0}
    #field-live-workflow .fp-logo{width:23px;height:23px;background:linear-gradient(135deg,#58abff,#2848ce);border-radius:7px;display:inline-block}
    #field-live-workflow .fp-iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;min-height:42px;border:1px solid var(--fp-line);border-radius:13px;background:var(--fp-paper);flex-shrink:0}
    #field-live-workflow .fp-avatar{border-radius:50%;background:var(--fp-blue-soft);color:var(--fp-blue);font-weight:600;border:0}
    #field-live-workflow .fp-headtitle{font-weight:600;font-size:15px;flex:1;min-width:0}
    #field-live-workflow .fp-main{overflow:auto;flex:1;min-height:0;padding:0 18px 22px;scrollbar-width:thin;overscroll-behavior:contain}
    #field-live-workflow h1{font-family:&#x27;Source Serif 4&#x27;,Georgia,serif;font-size:29px;line-height:1.15;font-weight:400;letter-spacing:-.7px;margin:6px 0 8px}
    #field-live-workflow h2{font-size:16px;line-height:1.4;font-weight:600;margin:0 0 9px;letter-spacing:-.25px}
    #field-live-workflow h3{font-size:14px;line-height:1.4;font-weight:600;margin:0 0 7px}
    #field-live-workflow p{margin:0 0 10px}
    #field-live-workflow small,#field-live-workflow .fp-small{font-size:12px;line-height:1.5}
    #field-live-workflow .fp-muted{color:var(--fp-muted)}
    #field-live-workflow .fp-kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fp-muted);margin-bottom:7px;font-weight:500}
    #field-live-workflow .fp-flex{display:flex;gap:8px;align-items:center;min-width:0}
    #field-live-workflow .fp-wrap{flex-wrap:wrap}
    #field-live-workflow .fp-grow{flex:1;min-width:0}
    #field-live-workflow .fp-spread{justify-content:space-between}
    #field-live-workflow .fp-gap{margin-top:16px}
    #field-live-workflow .fp-stack{display:flex;flex-direction:column;gap:10px}
    #field-live-workflow .fp-btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;border:1px solid var(--fp-line);border-radius:12px;background:var(--fp-paper);font-size:13px;font-weight:500;line-height:1.35;white-space:normal;text-align:center}
    #field-live-workflow .fp-btn.primary{background:var(--fp-blue);border-color:var(--fp-blue);color:var(--fp-onblue)}
    #field-live-workflow .fp-btn.soft{background:var(--fp-blue-soft);border-color:transparent;color:light-dark(#2544bc,#bdcdff)}
    #field-live-workflow .fp-btn.danger{color:var(--fp-warn);background:var(--fp-warn-bg);border-color:transparent}
    #field-live-workflow .fp-full{width:100%}
    #field-live-workflow .fp-link{padding:5px 0;color:light-dark(#2546c2,#b8caff);font-size:12px;font-weight:500;min-height:32px;display:inline-flex;align-items:center;gap:5px}
    #field-live-workflow .fp-askbar{display:flex;align-items:center;gap:10px;width:100%;padding:15px 15px;min-height:55px;background:var(--fp-paper);border:1px solid var(--fp-line);border-radius:16px;color:var(--fp-muted);font-size:14px;text-align:left}
    #field-live-workflow .fp-askbar svg{color:var(--fp-blue)}
    #field-live-workflow .fp-shortcuts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:10px 0 17px}
    #field-live-workflow .fp-shortcuts .fp-btn{justify-content:flex-start}
    #field-live-workflow .fp-scope-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;min-width:0}
    #field-live-workflow .fp-summary{border-radius:20px;background:linear-gradient(125deg,#263eaa,#2b4fdb);color:#fff;padding:18px;margin:14px 0 16px}
    #field-live-workflow .fp-summary .fp-kicker{color:#d2dcff}
    #field-live-workflow .fp-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
    #field-live-workflow .fp-summary strong{font-family:&#x27;Source Serif 4&#x27;,Georgia,serif;font-weight:400;font-size:29px;line-height:1.15;display:block;letter-spacing:-.5px}
    #field-live-workflow .fp-summary small{display:block;color:#e0e6ff;margin-top:3px}
    #field-live-workflow .fp-summary.expanded .fp-summary-grid&gt;div:nth-child(n+3){padding-top:12px;border-top:1px solid #ffffff30}
    #field-live-workflow .fp-summary.compact{padding:15px 17px}
    #field-live-workflow .fp-summary.compact strong{font-size:27px}
    #field-live-workflow .fp-summary button{color:#fff}
    #field-live-workflow .fp-tabs{display:flex;gap:3px;align-items:center;padding:4px;background:var(--fp-soft);border-radius:13px;max-width:100%;flex-wrap:wrap}
    #field-live-workflow .fp-tabs button{flex:1;min-height:37px;padding:7px 10px;font-weight:500;font-size:13px;line-height:1.35;border-radius:10px;display:flex;gap:6px;justify-content:center;align-items:center;white-space:normal}
    #field-live-workflow .fp-tabs button[aria-selected=true]{background:var(--fp-paper);color:light-dark(#2541c5,#d1dcff);box-shadow:0 1px 4px #12244a0c}
    #field-live-workflow .fp-pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
    #field-live-workflow .fp-pill{padding:7px 10px;min-height:34px;border:1px solid var(--fp-line);background:var(--fp-paper);border-radius:20px;font-size:12px;white-space:normal}
    #field-live-workflow .fp-pill[aria-pressed=true]{background:var(--fp-blue);border-color:var(--fp-blue);color:#fff}
    #field-live-workflow .fp-searchrow{display:flex;gap:7px;margin:12px 0}
    #field-live-workflow .fp-search{border:1px solid var(--fp-line);border-radius:12px;display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:var(--fp-paper);padding:0 11px}
    #field-live-workflow .fp-search input{width:100%;min-width:0;border:0;background:transparent;min-height:43px;padding:8px 0;outline-offset:0;font-size:14px}
    #field-live-workflow .fp-panel{border:1px solid var(--fp-line);border-radius:17px;background:var(--fp-paper);padding:16px;margin:12px 0}
    #field-live-workflow .fp-list{border:1px solid var(--fp-line);border-radius:17px;background:var(--fp-paper);overflow:hidden;margin:10px 0}
    #field-live-workflow .fp-row{display:flex;gap:10px;padding:14px 12px;align-items:flex-start;border-bottom:1px solid var(--fp-line);min-width:0}
    #field-live-workflow .fp-row:last-child{border-bottom:0}

const esc = (value) =&gt;

// ---- Dates -------------------------------------------------------------

const DAY = 86400000;

/** Local midnight for the demo&#x27;s &quot;today&quot;. Tests may pass a fixed date. */
function startOfDay(date = new Date()) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  return d;
}

const isoDate = (date) =&gt; {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, &#x27;0&#x27;)}-${String(d.getDate()).padStart(2, &#x27;0&#x27;)}`;
};

const fromIso = (iso) =&gt; {
  const [y, m, d] = iso.split(&#x27;-&#x27;).map(Number);
  return new Date(y, m - 1, d);
};

const addDays = (date, days) =&gt; new Date(startOfDay(date).getTime() + days * DAY);

const daysBetween = (a, b) =&gt; Math.round((startOfDay(b) - startOfDay(a)) / DAY);

function formatDate(date, opts = { weekday: &#x27;short&#x27;, day: &#x27;numeric&#x27;, month: &#x27;short&#x27; }) {
  return new Intl.DateTimeFormat(&#x27;en-GB&#x27;, opts).format(typeof date === &#x27;string&#x27; ? fromIso(date) : date);
}

/** &quot;Today&quot;, &quot;Tomorrow&quot;, &quot;Yesterday&quot;, &quot;In 3 days&quot;, &quot;12 days ago&quot;. */
function relativeDay(iso, today) {
  const diff = daysBetween(today, fromIso(iso));
  if (diff === 0) return &#x27;Today&#x27;;
  if (diff === 1) return &#x27;Tomorrow&#x27;;
  if (diff === -1) return &#x27;Yesterday&#x27;;
  if (diff &gt; 1 &amp;&amp; diff &lt; 7) return `In ${diff} days`;
  if (diff &lt; -1 &amp;&amp; diff &gt; -60) return `${-diff} days ago`;
  return formatDate(iso, { day: &#x27;numeric&#x27;, month: &#x27;short&#x27;, year: &#x27;numeric&#x27; });
}

function greeting(now = new Date()) {
  const h = now.getHours();
  if (h &lt; 12) return &#x27;Good morning&#x27;;
  if (h &lt; 17) return &#x27;Good afternoon&#x27;;
  return &#x27;Good evening&#x27;;
}

/** Minutes since midnight for &quot;HH:MM&quot;. */
const toMinutes = (time) =&gt; {
  const [h, m] = time.split(&#x27;:&#x27;).map(Number);
  return h * 60 + m;
};

const fromMinutes = (mins) =&gt;
  `${String(Math.floor(mins / 60) % 24).padStart(2, &#x27;0&#x27;)}:${String(mins % 60).padStart(2, &#x27;0&#x27;)}`;

/** The last `count` calendar quarters that have fully ended before `today`. */
function lastQuarters(today, count = 8) {
  let year = today.getFullYear();
  let q = Math.floor(today.getMonth() / 3); // current quarter index (0-3) is still open
  const out = [];
  for (let i = 0; i &lt; count; i++) {
    q -= 1;
    if (q &lt; 0) { q = 3; year -= 1; }
    out.unshift(`Q${q + 1} ${String(year).slice(2)}`);
  }
  return out;
}

function changeWords(n) {

function haversineKm([lon1, lat1], [lon2, lat2]) {
  const rad = Math.PI / 180;

}

const initials = (name) =&gt;
  name.replace(/^Dr\.\s*/, &#x27;&#x27;).split(/\s+/).map((p) =&gt; p[0]).slice(0, 2).join(&#x27;&#x27;).toUpperCase();

const uid = (prefix = &#x27;id&#x27;) =&gt; `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;

const plural = (n, one, many = `${one}s`) =&gt; `${n} ${n === 1 ? one : many}`;

// Deterministic quarterly volumes so the sample data looks lived-in but never changes between visits.

const SHAPE = [0, 3, -2, 1, -1, 2, -3, 1];

/**
 * Eight quarters of volume, oldest first, growing by roughly `growthPerYear`.
 * `base` is the volume of the oldest quarter.
 */
function series(base, growthPerYear) {
  const perQuarter = Math.pow(1 + growthPerYear, 1 / 4);
  return SHAPE.map((wobble, i) =&gt; Math.max(0, Math.round(base * Math.pow(perQuarter, i) * (1 + wobble / 60))));
}

/** Element-wise sum of several series. */
function addSeries(list) {
  return list.reduce((acc, s) =&gt; acc.map((v, i) =&gt; v + s[i]), new Array(SHAPE.length).fill(0));
}

// Ask Field Pro: answers plain-language questions from the rep&#x27;s own book.
// The prototype matches intents with keywords and computes answers from the
// sample data. The real version would send the question to an LLM that calls
// the same DocNexus endpoints the screens use, and return this answer shape.






/** Starter questions, grouped by the moment in a rep&#x27;s day they help with. */
const STARTERS = [
  { title: &#x27;Plan the day&#x27;, questions: [&#x27;Who should I see today?&#x27;, &#x27;What’s on my plan today?&#x27;, &#x27;Who is near Mount Sinai West?&#x27;] },
  { title: &#x27;Before a visit&#x27;, questions: [&#x27;Brief me on Dr. Maya Patel&#x27;, &#x27;Where does Dr. Alex Morgan refer patients?&#x27;, &#x27;Top doctors at Mount Sinai Hospital&#x27;] },
  { title: &#x27;Your territory&#x27;, questions: [&#x27;Which accounts are growing the most?&#x27;, &#x27;What has declined?&#x27;, &#x27;Where am I losing the most volume?&#x27;, &#x27;What follow-ups are overdue?&#x27;] },
];

/** The starter questions, with today&#x27;s next visit filled in where it helps. */
function startersFor(ctx) {
  const next = routeOrder(activeItems(ctx.ws.plans[ctx.todayIso])).find((i) =&gt; i.status === &#x27;planned&#x27;);
  const who = next ? getEntity(next.targetId) : null;
  if (!who) return STARTERS;
  const about = who.kind === &#x27;hcp&#x27; ? `Where does ${who.name} refer patients?` : `Where do patients at ${who.name} go?`;
  return STARTERS.map((g) =&gt; (g.title === &#x27;Before a visit&#x27; ? { ...g, questions: [`Brief me on ${who.name}`, about, g.questions[2]] } : g));
}

const QUESTION_START = /^(who|what|whats|which|where|when|why|how|show|list|brief|tell|give|any)\b/;

/** True when search text reads like a question, so Targets can offer to ask it. */
function looksLikeQuestion(text) {
  const q = normalise(text);
  if (q.split(&#x27; &#x27;).length &lt; 2) return false;
  return /\?\s*$/.test(String(text)) || QUESTION_START.test(q) || ![&#x27;search&#x27;, &#x27;brief&#x27;].includes(detectIntent(q));
}

const normalise = (s) =&gt; String(s || &#x27;&#x27;).toLowerCase().normalize(&#x27;NFKD&#x27;).replace(/[̀-ͯ]/g, &#x27;&#x27;).replace(/[^a-z0-9%\s-]/g, &#x27; &#x27;).replace(/\s+/g, &#x27; &#x27;).trim();

// Names reps actually say: last names, first names and short facility names.
const EXTRA_ALIASES = {
  &#x27;msh-system&#x27;: [&#x27;mount sinai health system&#x27;, &#x27;health system&#x27;, &#x27;mount sinai&#x27;],
  msh: [&#x27;mount sinai hospital&#x27;, &#x27;the main hospital&#x27;, &#x27;msh&#x27;],
  msw: [&#x27;mount sinai west&#x27;, &#x27;sinai west&#x27;, &#x27;msw&#x27;],
  msm: [&#x27;mount sinai morningside&#x27;, &#x27;morningside&#x27;, &#x27;msm&#x27;],
  kidney: [&#x27;kidney center&#x27;, &#x27;kidney&#x27;],
  harlem: [&#x27;harlem health center&#x27;, &#x27;harlem clinic&#x27;, &#x27;harlem&#x27;],
};

let aliasIndex = null;
function aliases() {
  if (aliasIndex) return aliasIndex;
  const out = [];
  for (const h of allHcps()) {
    const parts = normalise(h.name.replace(/^Dr\.?\s*/, &#x27;&#x27;)).split(&#x27; &#x27;);
    for (const a of new Set([parts.join(&#x27; &#x27;), parts.at(-1), parts[0], `dr ${parts.at(-1)}`])) out.push([a, h.id]);
  }
  for (const o of allOrgs()) {
    out.push([normalise(o.name), o.id]);
    for (const a of EXTRA_ALIASES[o.id] || []) out.push([a, o.id]);
  }
  aliasIndex = out.sort((a, b) =&gt; b[0].length - a[0].length);
  return aliasIndex;
}

/** The person or account a question is about, if it names one. */
function findEntity(question) {
  const q = ` ${normalise(question)} `;
  for (const [alias, id] of aliases()) {
    if (q.includes(` ${alias} `)) return getEntity(id);
  }
  return null;
}

const INTENTS = [
  [&#x27;followups&#x27;, /\b(follow ?-?ups?|overdue|owe|to ?-?dos?|tasks?)\b/],
  [&#x27;referrals&#x27;, /\b(refer\w*|sends?|sent)\b/],
  [&#x27;mix&#x27;, /\b(mix|which procedures|what procedures|procedure breakdown|breakdown)\b/],
  [&#x27;leakage&#x27;, /\b(leak\w*|losing|lose|lost|leaving|left the system|out of (the )?system|where do (patients|cases)( [a-z ]+)? go)\b/],
  [&#x27;decline&#x27;, /\b(declin\w*|drop\w*|down|fall\w*|fell|shrink\w*|decreas\w*|slow\w*|worse)\b/],
  [&#x27;growth&#x27;, /\b(grow\w*|increas\w*|rising|rise|fastest|gain\w*|trending up|up the most)\b/],
  [&#x27;near&#x27;, /\b(near|nearby|close to|closest|nearest|around)\b/],
  [&#x27;suggest&#x27;, /\b(who should i|who to (see|visit|call)|suggest\w*|recommend\w*|priorit\w*|where should i go|who next)\b/],
  [&#x27;plan&#x27;, /\b(today|tomorrow|my plan|schedule|agenda|next (visit|stop|meeting)|my day|on my plan|planned)\b/],
  [&#x27;people&#x27;, /\b(top|best|biggest|busiest|key|which) (hcps?|doctors?|surgeons?|physicians?|cardiologists?|people)\b|\bwho (works|practices)\b|\b(doctors|hcps|surgeons|physicians) at\b/],
  [&#x27;brief&#x27;, /\b(brief|tell me about|prep\w*|who is|what should i know|summar\w*|overview|about)\b/],
];

/** Which kind of question this is. */
function detectIntent(question, about = null) {
  const q = normalise(question);
  for (const [intent, pattern] of INTENTS) if (pattern.test(q)) return intent;
  if (findEntity(question) || (about &amp;&amp; refersBack(q))) return &#x27;brief&#x27;;
  return &#x27;search&#x27;;
}

// &quot;Where does she refer?&quot;, &quot;what about there?&quot;: the question continues the last answer.
const refersBack = (q) =&gt; /\b(she|he|they|her|his|their|them|it|its|there|this (account|doctor|hospital|one|person)|that (account|doctor|hospital|one|person)|same)\b/.test(q);
const PEOPLE_WORDS = /\b(hcps?|doctors?|surgeons?|physicians?|people|cardiologists?|who)\b/;

const listJoin = (items) =&gt; (items.length &lt; 2 ? items.join(&#x27;&#x27;) : `${items.slice(0, -1).join(&#x27;, &#x27;)} and ${items.at(-1)}`);
const PHRASES = {
  followup: (s) =&gt; (s.label.startsWith(&#x27;Overdue&#x27;) ? &#x27;an overdue follow-up&#x27; : &#x27;a follow-up due&#x27;),
  leakage: () =&gt; &#x27;leakage risk&#x27;,
  rising: () =&gt; &#x27;rising volume&#x27;,
  unseen: (s) =&gt; (s.label === &#x27;No contact yet&#x27; ? &#x27;no contact yet&#x27; : &#x27;no visit in 30+ days&#x27;),
};
/** Signals as a phrase, e.g. &quot;leakage risk and no visit in 30+ days&quot;. */
const reasons = (signals) =&gt; listJoin(signals.map((s) =&gt; PHRASES[s.id]?.(s) ?? s.label.toLowerCase()));
const possessive = (name) =&gt; `${name}’s`;

const SAMPLE = &#x27;Sample data&#x27;;
const last4 = (series) =&gt; sum(series.slice(-4));
const prev4 = (series) =&gt; sum(series.slice(0, 4));
const totals = (e) =&gt; {
  const rows = proceduresOf(e);
  if (!rows?.length) return null;
  const s = addSeries(rows.map((r) =&gt; r.series));
  return { prev: prev4(s), cur: last4(s), growth: procedureYoy(e) };
};
const accounts = () =&gt; allOrgs().filter((o) =&gt; o.type !== &#x27;Health system&#x27; &amp;&amp; proceduresOf(o)?.length);

/**
 * Answers a question. `ctx` is the app context (workspace, today, signals,
 * suggestions, planItemFor, dayName). `about` is the entity the conversation
 * is already about, so &quot;where does she refer?&quot; works as a follow-up.
 */
function answer(question, ctx, about = null) {
  const intent = detectIntent(question, about);
  const named = findEntity(question);
  const entity = named || (about &amp;&amp; refersBack(normalise(question)) ? getEntity(about) : null);
  const build = BUILDERS[intent] || BUILDERS.search;
  const result = build({ question, q: normalise(question), entity, named, ctx });
  return { intent, about: result.about ?? entity?.id ?? null, ...result };
}

const row = (e, figure, sub, extra = {}) =&gt; ({ id: e.id, title: e.name, sub, figure, ...extra });

const BUILDERS = {
  growth({ q, entity, ctx }) {
    const people = PEOPLE_WORDS.test(q);
    if (entity &amp;&amp; !(entity.kind === &#x27;hco&#x27; &amp;&amp; people)) return BUILDERS.trend({ entity });
    const pool = entity ? hcpsAt(entity.id) : people ? allHcps() : accounts();
    const ranked = pool.map((e) =&gt; ({ e, t: totals(e) })).filter((r) =&gt; r.t).sort((a, b) =&gt; b.t.growth - a.t.growth);
    if (!ranked.length) return empty(&#x27;No procedure volumes to compare yet.&#x27;);
    const top = ranked[0];
    const pick = ranked.slice(0, 3).find((r) =&gt; ctx.signals(r.e).some((s) =&gt; s.id === &#x27;leakage&#x27; || s.id === &#x27;unseen&#x27;)) || top;
    const pickSignals = ctx.signals(pick.e).filter((s) =&gt; s.id !== &#x27;rising&#x27;);
    return {
      scope: [&#x27;2025 vs the 12 before&#x27;, entity?.kind === &#x27;hco&#x27; ? `At ${entity.name}` : &#x27;Your book&#x27;, SAMPLE],

      columns: [&#x27;Name&#x27;, &#x27;Change&#x27;],
      rows: ranked.slice(0, 5).map(({ e, t }) =&gt; row(e, &#x27;&#x27;, `${e.kind === &#x27;hcp&#x27; ? e.specialty : e.typeDetail} · ${formatNumber(t.cur)} procedures`, { change: t.growth, tab: &#x27;volumes&#x27; })),
      doThis: {
        text: pickSignals.length ? `${pick.e.name} is growing, with ${reasons(pickSignals)}. Start there.` : `${pick.e.name} is growing fastest. Visit while volume is moving.`,
        label: `Open ${pick.e.name}`, action: &#x27;openProfile&#x27;, data: { id: pick.e.id, tab: &#x27;volumes&#x27; }, add: pick.e.id,
      },
      next: [&#x27;What has declined?&#x27;, &#x27;Where am I losing the most volume?&#x27;, people ? &#x27;Which accounts are growing the most?&#x27; : &#x27;Which doctors are growing the most?&#x27;],
      about: pick.e.id,

  },

  decline({ q, entity }) {

    const pool = entity?.kind === &#x27;hco&#x27; ? hcpsAt(entity.id) : [...(people ? [] : accounts()), ...allHcps()];
    const ranked = pool.map((e) =&gt; ({ e, t: totals(e) })).filter((r) =&gt; r.t).sort((a, b) =&gt; a.t.growth - b.t.growth);
    const down = ranked.filter((r) =&gt; r.t.growth &lt; 0);
    if (!down.length) {

        scope: [&#x27;2025 vs the 12 before&#x27;, SAMPLE],
        summary: `Nothing declined. Slowest growth is ${slow.e.name}, ${changeWords(slow.t.growth)}.`,
        columns: [&#x27;Name&#x27;, &#x27;Change&#x27;],
        rows: ranked.slice(0, 5).map(({ e, t }) =&gt; row(e, &#x27;&#x27;, `${formatNumber(t.cur)} procedures`, { change: t.growth, tab: &#x27;volumes&#x27; })),
        next: [&#x27;Which accounts are growing the most?&#x27;, &#x27;Where am I losing the most volume?&#x27;],
      };
    }
    const top = down[0];
    const family = proceduresOf(top.e).map((r) =&gt; ({ r, g: (last4(r.series) - prev4(r.series)) })).sort((a, b) =&gt; a.g - b.g)[0].r;
    return {
      scope: [&#x27;2025 vs the 12 before&#x27;, entity?.kind === &#x27;hco&#x27; ? `At ${entity.name}` : &#x27;People and accounts&#x27;, SAMPLE],
      summary: `${plural(down.length, &#x27;target&#x27;)} declined. The biggest drop is ${top.e.name}: ${formatNumber(top.t.prev)} to ${formatNumber(top.t.cur)} procedures (${changeWords(top.t.growth)}).`,
      columns: [&#x27;Name&#x27;, &#x27;Change&#x27;],
      rows: down.slice(0, 5).map(({ e, t }) =&gt; row(e, &#x27;&#x27;, `${e.kind === &#x27;hcp&#x27; ? e.specialty : e.typeDetail} · ${formatNumber(t.cur)} procedures`, { change: t.growth, tab: &#x27;volumes&#x27; })),
      doThis: {
        text: `Most of ${possessive(top.e.name)} drop is in ${family.family.toLowerCase()}. Ask where those cases are going now.`,
        label: `Open ${top.e.name}`, action: &#x27;openProfile&#x27;, data: { id: top.e.id, tab: &#x27;volumes&#x27; }, add: top.e.id,
      },
      next: [top.e.kind === &#x27;hcp&#x27; ? `Where does ${top.e.name} refer patients?` : `Where do patients at ${top.e.name} go?`, &#x27;Which accounts are growing the most?&#x27;, &#x27;Where am I losing the most volume?&#x27;],

  leakage({ entity }) {

      const top = l.destinations[0];

        rows: l.destinations.map((d) =&gt; (d.orgId

    if (entity?.kind === &#x27;hcp&#x27;) return BUILDERS.referrals({ entity });
    const ranked = allOrgs().filter((o) =&gt; o.leakage &amp;&amp; o.type !== &#x27;Health system&#x27;).sort((a, b) =&gt; b.leakage.leftPct - a.leakage.leftPct);
    const top = ranked[0];
    const lost = sum(ranked.map((o) =&gt; Math.round(o.leakage.patients * (o.leakage.leftPct / 100))));
    const referrer = hcpsAt(top.id).map((h) =&gt; ({ h, out: sum(h.referrals.outbound.filter((r) =&gt; r.ref).map((r) =&gt; r.count)) })).sort((a, b) =&gt; b.out - a.out)[0];
    return {
      scope: [&#x27;Patients who left the system&#x27;, &#x27;2025&#x27;, SAMPLE],

      columns: [&#x27;Account&#x27;, &#x27;Left&#x27;],
      rows: ranked.map((o) =&gt; row(o, `${o.leakage.leftPct}%`, `${formatNumber(o.leakage.patients)} patients · biggest gap ${o.leakage.byFamily[0].family}`, { tone: o.leakage.leftPct &gt;= 20 ? &#x27;warn&#x27; : &#x27;&#x27;, tab: &#x27;leakage&#x27; })),
      doThis: referrer?.out
        ? { text: `${referrer.h.name} sends ${referrer.out} patients a year out of the system from ${top.name}. Start there.`, label: `Open ${referrer.h.name}`, action: &#x27;openProfile&#x27;, data: { id: referrer.h.id, tab: &#x27;referrals&#x27; }, add: referrer.h.id }
        : { text: `${top.leakage.byFamily[0].family} is the biggest gap at ${top.name}.`, label: `Open ${top.name}`, action: &#x27;openProfile&#x27;, data: { id: top.id, tab: &#x27;leakage&#x27; }, add: top.id },

  referrals({ entity }) {

      return {
        scope: [&#x27;Referrals out of the system&#x27;, &#x27;2025&#x27;, SAMPLE],
        summary: `${ranked[0].h.name} sends the most patients out of the system: ${ranked[0].out} in the 2025.`,
        columns: [&#x27;Doctor&#x27;, &#x27;Sent out&#x27;],
        rows: ranked.slice(0, 5).map(({ h, out }) =&gt; row(h, String(out), `${h.specialty} · ${primaryOrg(h).name}`, { tone: &#x27;warn&#x27;, tab: &#x27;referrals&#x27; })),
        doThis: { text: `A visit to ${ranked[0].h.name} could keep the most patients in the system.`, label: `Open ${ranked[0].h.name}`, action: &#x27;openProfile&#x27;, data: { id: ranked[0].h.id, tab: &#x27;referrals&#x27; }, add: ranked[0].h.id },

      doThis: topOut ? { text: `Ask why ${topOut.reason} patients go to ${destination(topOut.ref).name} instead of staying in the system.`, label: &#x27;Open referrals&#x27;, action: &#x27;openProfile&#x27;, data: { id: entity.id, tab: &#x27;referrals&#x27; }, add: entity.id } : null,

  /** How one person or account is trending, family by family. */
  trend({ entity }) {

    const families = proceduresOf(entity).map((r) =&gt; ({ r, prev: prev4(r.series), cur: last4(r.series) }))

  mix({ entity }) {

      summary: `${sorted[0].family} is ${Math.round((last4(sorted[0].series) / total) * 100)}% of ${possessive(e.name)} ${formatNumber(total)} procedures in the 2025.`,
      columns: [&#x27;Procedure&#x27;, &#x27;Count&#x27;],

      doThis: { text: &#x27;Open the volumes tab for the quarter-by-quarter trend.&#x27;, label: &#x27;Open volumes&#x27;, action: &#x27;openProfile&#x27;, data: { id: e.id, tab: &#x27;volumes&#x27; }, add: e.id },

  },

  search({ question, q, ctx }) {

      function discoveryControls(){return `${s.source===&#x27;territories&#x27;?tabs([[&#x27;assigned&#x27;,&#x27;Targets&#x27;],[&#x27;explore&#x27;,&#x27;Explore territory&#x27;]],s.view,&#x27;view&#x27;):&#x27;&#x27;}&lt;div class=&quot;fp-flex fp-spread fp-gap&quot;&gt;${tabs([[&#x27;hco&#x27;,icon(&#x27;building-2&#x27;)+&#x27; HCOs&#x27;],[&#x27;hcp&#x27;,icon(&#x27;users&#x27;)+&#x27; HCPs&#x27;]],s.kind,&#x27;kind&#x27;)}&lt;span class=&quot;fp-small fp-muted&quot;&gt;${scoped(s).length} ${s.kind===&#x27;hco&#x27;?(scoped(s).length===1?&#x27;account&#x27;:&#x27;accounts&#x27;):(scoped(s).length===1?&#x27;person&#x27;:&#x27;people&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fp-pills&quot;&gt;${groups.map(g=&gt;`&lt;button type=&quot;button&quot; class=&quot;fp-pill cursor-interaction&quot; data-act=&quot;group:${g}&quot; aria-pressed=&quot;${s.group===g}&quot;&gt;${g}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${s.source===&#x27;new&#x27;?`&lt;div class=&quot;fp-note&quot;&gt;${icon(&#x27;navigation&#x27;)} ${s.near?`${esc(s.origin)} · ${s.radius} miles`:[s.city,s.geoState].filter(Boolean).join(&#x27;, &#x27;)} ${link(&#x27;Change&#x27;,&#x27;filters&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;fp-searchrow&quot;&gt;&lt;label class=&quot;fp-search&quot;&gt;${icon(&#x27;search&#x27;)}&lt;input name=&quot;query&quot; aria-label=&quot;Search HCOs or HCPs&quot; placeholder=&quot;Search name, specialty or NPI&quot; value=&quot;${esc(s.query)}&quot;&gt;&lt;/label&gt;${ib(&#x27;sliders-horizontal&#x27;,&#x27;filters&#x27;,&#x27;Filter results&#x27;)}&lt;/div&gt;${s.replacing?`&lt;div class=&quot;fp-note warn&quot;&gt;&lt;strong&gt;Replacing ${esc(byId(s.replacing.entity).name)}&lt;/strong&gt;&lt;br&gt;Choose one alternative. Your existing route is kept.${link(&#x27;Keep original visit&#x27;,&#x27;replace-cancel&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}`;}
      function targets(){const rows=scoped(s);return `${shortcuts()}${s.routeStarted?`&lt;div class=&quot;fp-note fp-flex&quot;&gt;&lt;span class=&quot;fp-grow&quot;&gt;${icon(&#x27;route&#x27;)} Route in progress · ${s.plan.filter(v=&gt;v.status===&#x27;done&#x27;).length}/${s.plan.filter(v=&gt;v.status!==&#x27;cancelled&#x27;).length} visits done&lt;/span&gt;${link(&#x27;Resume&#x27;,&#x27;resume&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}${summary()}${discoveryControls()}${s.query?`&lt;div class=&quot;fp-small fp-muted&quot;&gt;Results for “${esc(s.query)}”&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;fp-list&quot;&gt;${rows.length?rows.map(e=&gt;entityRow(e)).join(&#x27;&#x27;):`&lt;div class=&quot;fp-empty&quot;&gt;${s.source===&#x27;territories&#x27;&amp;&amp;s.view===&#x27;assigned&#x27;?&#x27;No assigned targets in this view. Explore the territory to add HCOs or HCPs.&#x27;:&#x27;No matches in this sample. Try New York, a different code group or another HCO/HCP view.&#x27;}${b(&#x27;Clear filters&#x27;,&#x27;clear-filters&#x27;,&#x27;fp-full fp-gap&#x27;)}&lt;/div&gt;`}&lt;/div&gt;&lt;div class=&quot;fp-small fp-muted&quot;&gt;${s.source===&#x27;territories&#x27;&amp;&amp;s.view===&#x27;assigned&#x27;?&#x27;Assigned coverage&#x27;:&#x27;Sample results&#x27;} · ${esc(s.group)} · 2025${s.source===&#x27;new&#x27;?&#x27; · straight-line distances · availability not known&#x27;:&#x27;&#x27;}&lt;/div&gt;${s.recent.length?`&lt;div class=&quot;fp-gap&quot;&gt;&lt;div class=&quot;fp-kicker&quot;&gt;Recently viewed&lt;/div&gt;&lt;div class=&quot;fp-pills&quot;&gt;${s.recent.map(id=&gt;b(esc(byId(id).name),&#x27;entity:&#x27;+id,&#x27;&#x27;)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}`;}
      function mapScreen(){const rows=scoped(s),pin=s.pin&amp;&amp;sites[s.pin];return `${shortcuts()}&lt;h1&gt;Opportunity Map&lt;/h1&gt;${discoveryControls()}${map(&#x27;discovery&#x27;,true)}&lt;div class=&quot;fp-flex fp-spread&quot;&gt;&lt;div class=&quot;fp-small fp-muted&quot;&gt;${s.mapLayer===&#x27;pins&#x27;?&#x27;Pins · selected scope&#x27;:s.mapLayer===&#x27;zip&#x27;?&#x27;ZIP sample · volume&#x27;:&#x27;Area density preview&#x27;}&lt;/div&gt;&lt;div class=&quot;fp-pills&quot;&gt;${[[&#x27;pins&#x27;,&#x27;Pins&#x27;],[&#x27;zip&#x27;,&#x27;ZIP&#x27;],[&#x27;county&#x27;,&#x27;County&#x27;]].map(([k,l])=&gt;`&lt;button class=&quot;fp-pill cursor-interaction&quot; data-act=&quot;layer:${k}&quot; aria-pressed=&quot;${s.mapLayer===k}&quot;&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;${s.mapLayer!==&#x27;pins&#x27;?&#x27;&lt;div class=&quot;fp-small fp-muted&quot;&gt;Density preview uses the same three sample facilities; it is not a complete regional heat map.&lt;/div&gt;&#x27;:&#x27;&#x27;}${pin?`&lt;div class=&quot;fp-panel&quot;&gt;&lt;div class=&quot;fp-flex fp-spread&quot;&gt;&lt;h2&gt;${esc(pin.name)}&lt;/h2&gt;${link(&#x27;Clear&#x27;,&#x27;pin-clear&#x27;)}&lt;/div&gt;&lt;p class=&quot;fp-small fp-muted&quot;&gt;${pin.zip} · ${fmt(vol({...pin,kind:&#x27;hco&#x27;},s))} procedures · 2025&lt;/p&gt;&lt;div class=&quot;fp-flex fp-wrap&quot;&gt;${b(&#x27;Open account&#x27;,&#x27;entity:&#x27;+s.pin,&#x27;primary&#x27;)}${b(&#x27;See HCPs&#x27;,&#x27;site-hcps:&#x27;+s.pin)}&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;h2 class=&quot;fp-gap&quot;&gt;${s.source===&#x27;new&#x27;?&#x27;New opportunities&#x27;:&#x27;Results in this scope&#x27;}&lt;/h2&gt;&lt;div class=&quot;fp-list&quot;&gt;${rows.length?rows.map(e=&gt;entityRow(e,{compact:true})).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;fp-empty&quot;&gt;No matching locations. Change the area or filters.&lt;/div&gt;&#x27;}&lt;/div&gt;`;}
      function entityHeader(e){return `&lt;div class=&quot;fp-identity&quot;&gt;&lt;span class=&quot;fp-initial&quot;&gt;${initials(e)}&lt;/span&gt;&lt;div class=&quot;fp-grow&quot;&gt;&lt;div class=&quot;fp-kicker&quot;&gt;${esc(e.kind===&#x27;hco&#x27;?e.type:e.specialty)}&lt;/div&gt;&lt;h1&gt;${esc(e.name)}&lt;/h1&gt;&lt;div class=&quot;fp-small fp-muted&quot;&gt;${esc(e.kind===&#x27;hco&#x27;?e.city+&#x27; · &#x27;+e.parent:S(e.id).name)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fp-flex fp-wrap&quot;&gt;${tag(membershipLabel(e,s)||&#x27;Not assigned&#x27;,membershipLabel(e,s)?&#x27;blue&#x27;:&#x27;&#x27;)}${e.kind===&#x27;hcp&#x27;?tag(&#x27;NPI &#x27;+e.npi):tag(&#x27;Individual facility&#x27;)}${tag(s.group+&#x27; · 2025&#x27;)}&lt;/div&gt;`;}
      function commonActions(e){return `&lt;div class=&quot;fp-actions&quot;&gt;${b(icon(&#x27;sparkles&#x27;)+&#x27; Prepare / Ask&#x27;,&#x27;ask:entity&#x27;,&#x27;soft&#x27;)}${b(icon(&#x27;plus&#x27;)+(s.selected.includes(e.id)?&#x27;In route selection&#x27;:&#x27;Add to route&#x27;),&#x27;select:&#x27;+e.id,s.selected.includes(e.id)?&#x27;soft&#x27;:&#x27;primary&#x27;)}${b(icon(&#x27;notebook-pen&#x27;)+&#x27; Log visit&#x27;,&#x27;log:&#x27;+e.id)}${b(icon(&#x27;map-pinned&#x27;)+&#x27; Assign territory&#x27;,&#x27;assign:&#x27;+e.id)}&lt;/div&gt;&lt;div class=&quot;fp-flex fp-wrap&quot;&gt;${link(&#x27;Book appointment&#x27;,&#x27;booking:&#x27;+e.id)}${link(&#x27;Leakage report&#x27;,&#x27;report:&#x27;+e.id)}${link(&#x27;More&#x27;,&#x27;more:&#x27;+e.id)}&lt;/div&gt;`;}
      function prepCard(e){const last=s.notes.filter(n=&gt;n.entity===e.id&amp;&amp;!n.deleted).sort((a,b)=&gt;a.date.localeCompare(b.date)).at(-1),due=s.followups.filter(f=&gt;f.entity===e.id&amp;&amp;!f.done);return `&lt;section class=&quot;fp-panel&quot;&gt;&lt;div class=&quot;fp-flex fp-spread&quot;&gt;&lt;div class=&quot;fp-kicker&quot;&gt;Before your visit&lt;/div&gt;&lt;div class=&quot;fp-flex&quot;&gt;${link(&#x27;Purpose&#x27;,&#x27;brief-edit:&#x27;+e.id)}${link(&#x27;Prepare with Ask&#x27;,&#x27;prep:&#x27;+e.id)}&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;${s.prep[e.id]?&#x27;Your visit brief&#x27;:&#x27;What to open with&#x27;}&lt;/h2&gt;&lt;p&gt;${esc(s.prep[e.id]||e.goal||&#x27;Review leakage destinations and agree on the next conversation.&#x27;)}&lt;/p&gt;${last?`&lt;p class=&quot;fp-small fp-muted&quot;&gt;&lt;strong&gt;Last contact · ${stamp(last.date)}&lt;/strong&gt;&lt;br&gt;${esc(last.text)}&lt;/p&gt;`:&#x27;&lt;p class=&quot;fp-small fp-muted&quot;&gt;No previous visit note on file.&lt;/p&gt;&#x27;}${due.map(f=&gt;`&lt;div class=&quot;fp-note&quot;&gt;${icon(&#x27;circle-check&#x27;)} ${esc(f.text)} · ${stamp(f.due)}&lt;/div&gt;`).join(&#x27;&#x27;)}${link(&#x27;View activity&#x27;,&#x27;profile-activity&#x27;)}${s.prep[e.id]?link(&#x27;Edit brief&#x27;,&#x27;brief-edit:&#x27;+e.id):&#x27;&#x27;}&lt;/section&gt;`;}
      function hcoPage(){const e=byId(s.id),site=sites[e.id];return `${entityHeader(e)}${commonActions(e)}${tabs([[&#x27;overview&#x27;,&#x27;Account overview&#x27;],[&#x27;people&#x27;,&#x27;HCPs here&#x27;],[&#x27;analysis&#x27;,&#x27;Analysis&#x27;],[&#x27;activity&#x27;,&#x27;Activity&#x27;]],s.hcoTab,&#x27;hcotab&#x27;)}${s.hcoTab===&#x27;people&#x27;?`&lt;div class=&quot;fp-gap&quot;&gt;&lt;h2&gt;HCPs at this account&lt;/h2&gt;&lt;p class=&quot;fp-small fp-muted&quot;&gt;Ranked by claims in ${esc(s.group)} · 2025. Sample clinicians.&lt;/p&gt;&lt;div class=&quot;fp-list&quot;&gt;${allHcp.filter(p=&gt;p.site===e.id&amp;&amp;(s.group===&#x27;All codes&#x27;||p.codes.includes(s.group))).map(p=&gt;entityRow(p)).join(&#x27;&#x27;)}&lt;/div&gt;${link(&#x27;Explore HCPs near this account&#x27;,&#x27;near-site:&#x27;+e.id)}&lt;/div&gt;`:s.hcoTab===&#x27;activity&#x27;?profileActivity(e):s.hcoTab===&#x27;analysis&#x27;?hcoAnalysis(e):`&lt;div class=&quot;fp-metrics&quot;&gt;${metric(&#x27;Procedures&#x27;,fmt(vol(e,s)),&#x27;↑ &#x27;+e.trend+&#x27;% vs 2024&#x27;)}${metric(&#x27;Left the account&#x27;,(e.left/e.volume*100).toFixed(1)+&#x27;%&#x27;,fmt(Math.round(e.left*factor(s)))+&#x27; of &#x27;+fmt(vol(e,s))+&#x27; · 2025&#x27;)}&lt;/div&gt;${prepCard(e)}&lt;div class=&quot;fp-panel&quot;&gt;&lt;h2&gt;Procedure mix&lt;/h2&gt;${mix(e)}${link(&#x27;All account analysis&#x27;,&#x27;hcotab:analysis&#x27;)}&lt;/div&gt;&lt;div class=&quot;fp-panel&quot;&gt;&lt;h2&gt;Where the cases go&lt;/h2&gt;${destinations(e)}${b(&#x27;Generate leakage report&#x27;,&#x27;pro-report:&#x27;+e.id,&#x27;fp-full&#x27;)}&lt;/div&gt;&lt;div class=&quot;fp-panel&quot;&gt;&lt;div class=&quot;fp-flex fp-spread&quot;&gt;&lt;h2&gt;Who to see here&lt;/h2&gt;${link(&#x27;All HCPs&#x27;,&#x27;hcotab:people&#x27;)}&lt;/div&gt;${allHcp.filter(p=&gt;p.site===e.id).slice(0,2).map(p=&gt;`&lt;div class=&quot;fp-detail&quot;&gt;${link(esc(p.name)+&#x27; &#x27;+icon(&#x27;chevron-right&#x27;),&#x27;entity:&#x       function mix(e){const total=vol(e,s);if(!total)return &#x27;&lt;p class=&quot;fp-small fp-muted&quot;&gt;No sample claims in this code group for this HCP.&lt;/p&gt;&#x27;;const names=s.group===&#x27;All codes&#x27;?(e.kind===&#x27;hcp&#x27;?e.codes:[&#x27;Hernia&#x27;,&#x27;Colectomy&#x27;,&#x27;Bariatric&#x27;]):[s.group],codeLabels={Hernia:&#x27;CPT 49591&#x27;,Colectomy:&#x27;CPT 44204&#x27;,Bariatric:&#x27;CPT 43775&#x27;};let used=0;return names.map((name,i)=&gt;{const n=i===names.length-1?total-used:vol(e,{...s,group:name});used+=n;return detail(name+&#x27; · &#x27;+codeLabels[name],fmt(n),`${(n/total*100).toFixed(1)}% · procedure claims · 2025`,n/total*100);}).join(&#x27;&#x27;);}
      function destinations(e){const total=Math.round(e.kind===&#x27;hco&#x27;?e.left*factor(s):vol(e,s)*.11),a=Math.round(total*.57);return detail(&#x27;Other hospitals&#x27;,fmt(a),&#x27;57% of cases leaving&#x27;,57)+detail(&#x27;Other outpatient facilities&#x27;,fmt(total-a),&#x27;43% of cases leaving&#x27;,43)+`&lt;div class=&quot;fp-small fp-muted fp-gap&quot;&gt;Sample destinations · ${esc(s.group)} · 2025. Counts are claims, not appointment availability.&lt;/div&gt;`;}
      function hcoAnalysis(e){return `&lt;div class=&quot;fp-metrics&quot;&gt;${metric(&#x27;Opportunity&#x27;,&#x27;$&#x27;+(e.opportunity*factor(s)).toFixed(1)+&#x27;M&#x27;,&#x27;Billed charges · 2025&#x27;)}${metric(&#x27;In-radius share&#x27;,e.market+&#x27;%&#x27;,&#x27;Within 100 miles · 2025&#x27;)}&lt;/div&gt;&lt;details open&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Procedure volume by year&lt;/summary&gt;&lt;div class=&quot;fp-inside&quot;&gt;${chart([Math.round(vol(e,s)*.82),Math.round(vol(e,s)/(1+e.trend/100)),vol(e,s)],[&#x27;2023&#x27;,&#x27;2024&#x27;,&#x27;2025&#x27;])}&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Leakage by quarter &amp; destinations&lt;/summary&gt;&lt;div class=&quot;fp-inside&quot;&gt;${chart([10,11,9,Math.round(e.left/e.volume*100)],[&#x27;Q1&#x27;,&#x27;Q2&#x27;,&#x27;Q3&#x27;,&#x27;Q4&#x27;],&#x27;percent leakage&#x27;)}${destinations(e)}${link(&#x27;Ask about leakage&#x27;,&#x27;ask:leakage&#x27;)}&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Capacity, profile &amp; robotic-assist claims&lt;/summary&gt;&lt;div class=&quot;fp-inside&quot;&gt;${detail(&#x27;Beds&#x27;,fmt(e.beds),&#x27;Facility profile&#x27;)}${detail(&#x27;Operating rooms&#x27;,&#x27;Not available&#x27;,&#x27;No verified value in this sample&#x27;)}${detail(&#x27;Robotic-assist claims&#x27;,&#x27;268&#x27;,&#x27;S2900 · sample 2025&#x27;)}${detail(&#x27;Ownership&#x27;,&#x27;Nonprofit&#x27;,e.parent)}&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Payer mix &amp; site of care&lt;/summary&gt;&lt;div class=&quot;fp-inside&quot;&gt;${detail(&#x27;Commercial&#x27;,&#x27;48%&#x27;,&#x27;Claims by payer · 2025&#x27;,48)}${detail(&#x27;Medicare&#x27;,&#x27;37%&#x27;,&#x27;Claims by payer · 2025&#x27;,37)}${detail(&#x27;Other&#x27;,&#x27;15%&#x27;,&#x27;Claims by payer · 2025&#x27;,15)}${detail(&#x27;Outpatient&#       function hcpPage(visitMode=false){const e=byId(s.id),v=visitMode?s.plan.find(v=&gt;v.id===s.currentVisit):null;return `${visitMode?`&lt;div class=&quot;fp-steps&quot;&gt;&lt;strong&gt;Visit ${s.plan.filter(x=&gt;x.status!==&#x27;cancelled&#x27;).indexOf(v)+1} of ${s.plan.filter(x=&gt;x.status!==&#x27;cancelled&#x27;).length}&lt;/strong&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;${esc(v?.mode===&#x27;Appointment&#x27;?v.time:&#x27;Flexible stop&#x27;)}&lt;/span&gt;${link(&#x27;Route&#x27;,&#x27;route&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}${entityHeader(e)}${visitMode?`&lt;div class=&quot;fp-actions&quot;&gt;${b(icon(&#x27;notebook-pen&#x27;)+&#x27; Log visit&#x27;,&#x27;log:&#x27;+e.id,&#x27;primary&#x27;)}${b(icon(&#x27;sparkles&#x27;)+&#x27; Prepare&#x27;,&#x27;prep:&#x27;+e.id,&#x27;soft&#x27;)}&lt;/div&gt;&lt;div class=&quot;fp-flex fp-wrap&quot;&gt;${link(&#x27;Appointment&#x27;,&#x27;booking:&#x27;+e.id)}${link(&#x27;Leakage report&#x27;,&#x27;report:&#x27;+e.id)}${link(&#x27;Can’t meet / cancel&#x27;,&#x27;visit-options:&#x27;+e.id)}&lt;/div&gt;`:commonActions(e)}${tabs([[&#x27;overview&#x27;,&#x27;Overview&#x27;],[&#x27;clinical&#x27;,&#x27;Clinical&#x27;],[&#x27;referrals&#x27;,&#x27;Referrals&#x27;],[&#x27;activity&#x27;,&#x27;Activity&#x27;]],s.profileTab,&#x27;hcptab&#x27;)}${s.profileTab===&#x27;activity&#x27;?profileActivity(e):s.profileTab===&#x27;clinical&#x27;?hcpClinical(e):s.profileTab===&#x27;referrals&#x27;?referrals(e):`&lt;div class=&quot;fp-metrics&quot;&gt;${metric(&#x27;Claims&#x27;,fmt(vol(e,s)),&#x27;↑ &#x27;+e.trend+&#x27;% vs 2024&#x27;)}${metric(&#x27;Last contact&#x27;,s.notes.filter(n=&gt;n.entity===e.id&amp;&amp;!n.deleted).length?stamp(s.notes.filter(n=&gt;n.entity===e.id&amp;&amp;!n.deleted).sort((a,b)=&gt;a.date.localeCompare(b.date)).at(-1).date):e.last,&#x27;See dated visit records&#x27;)}&lt;/div&gt;${prepCard(e)}&lt;div class=&quot;fp-panel&quot;&gt;&lt;h2&gt;At a glance&lt;/h2&gt;${detail(&#x27;Primary hospital&#x27;,S(e.id).       function hcpClinical(e){return `&lt;div class=&quot;fp-note&quot;&gt;${esc(s.group)} · 2025 · procedure claims. Search and scope apply to the visible sample rows.&lt;/div&gt;&lt;div class=&quot;fp-panel&quot;&gt;&lt;div class=&quot;fp-flex fp-spread&quot;&gt;&lt;h2&gt;What they do&lt;/h2&gt;${link(&#x27;Ask&#x27;,&#x27;ask:clinical&#x27;)}&lt;/div&gt;${mix(e)}&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Diagnoses · ICD-10&lt;/summary&gt;&lt;div class=&quot;fp-inside&quot;&gt;${detail(&#x27;K40 · Inguinal hernia&#x27;,fmt(Math.round(vol(e,s)*.52)),&#x27;Diagnosis claims · sample 2025&#x27;)}${detail(&#x27;K43 · Other hernia&#x27;,fmt(Math.round(vol(e,s)*.25)),&#x27;Diagnosis claims · sample 2025&#x27;)}&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Prescribing · Rx&lt;/summary&gt;&lt;div class=&quot;fp-inside&quot;&gt;&lt;p class=&quot;fp-small fp-muted&quot;&gt;No prescribing data supplied for these selected procedure codes. A drug/code scope is required.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Payer claims&lt;/summary&gt;&lt;div class=&quot;fp-inside&quot;&gt;${detail(&#x27;Commercial&#x27;,&#x27;51%&#x27;,&#x27;Procedure claims · 2025&#x27;,51)}${detail(&#x27;Medicare&#x27;,&#x27;34%&#x27;,&#x27;Procedure claims · 2025&#x27;,34)}${detail(&#x27;Other&#x27;,&#x27;15%&#x27;,&#x27;Procedure claims · 2025&#x27;,15)}&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;fp-panel&quot;&gt;&lt;h2&gt;Volume trend&lt;/h2&gt;${chart([Math.round(vol(e,s)*.81),Math.round(vol(e,s)/(1+e.trend/100)),vol(e,s)],[&#x27;2023&#x27;,&#x27;2024&#x27;,&#x27;2025&#x27;])}&lt;/div&gt;`;}
      function referrals(e){const mode=s.refMode||&#x27;dx&#x27;,names=allHcp.filter(p=&gt;p.id!==e.id).slice(0,3),base=mode===&#x27;dx&#x27;?116:84;return `&lt;div class=&quot;fp-gap&quot;&gt;${tabs([[&#x27;dx&#x27;,&#x27;Diagnoses&#x27;],[&#x27;px&#x27;,&#x27;Procedures&#x27;]],mode,&#x27;refmode&#x27;)}&lt;/div&gt;&lt;div class=&quot;fp-note&quot;&gt;${mode===&#x27;dx&#x27;?&#x27;Diagnosis&#x27;:&#x27;Procedure&#x27;} referral sample · 2025 · counts per code, not unique patients.&lt;/div&gt;&lt;div class=&quot;fp-panel&quot;&gt;&lt;div class=&quot;fp-flex fp-spread&quot;&gt;&lt;h2&gt;Who sends them work&lt;/h2&gt;${link(&#x27;Ask&#x27;,&#x27;ask:referrals&#x27;)}&lt;/div&gt;${names.map((p,i)=&gt;`&lt;div class=&quot;fp-detail&quot;&gt;&lt;div class=&quot;fp-detail-top&quot;&gt;${link(esc(p.name),&#x27;entity:&#x27;+p.id)}&lt;span&gt;${fmt(base-i*23)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fp-small fp-muted&quot;&gt;${esc(p.specialty)} · ${mode===&#x27;dx&#x27;?&#x27;K40&#x27;:&#x27;49591&#x27;} · ${esc(S(p.id).name)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;p class=&quot;fp-small fp-muted fp-gap&quot;&gt;Top 3 of ${mode===&#x27;dx&#x27;?48:32} sample referring HCPs.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;fp-panel&quot;&gt;&lt;h2&gt;Where they send work&lt;/h2&gt;${names.slice().reverse().map((p,i)=&gt;`&lt;div class=&quot;fp-detail&quot;&gt;${link(esc(p.name),&#x27;entity:&#x27;+p.id)}&lt;span style=&quot;float:right&quot;&gt;${base-24-i*19}&lt;/span&gt;&lt;small class=&quot;fp-muted&quot; style=&quot;display:block&quot;&gt;${esc(S(p.id).name)} · ${mode===&#x27;dx&#x27;?&#x27;Diagnoses&#x27;:&#x27;Procedures&#x27;}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;fp-panel&quot;&gt;&lt;h2&gt;Where their cases go&lt;/h2&gt;${destinations(e)}${link(&#x27;Account leakage report&#x27;,&#x27;report:&#x27;+e.id)}&lt;/div&gt;`;}

      function routePage(){const p=s.routeDraft||s.plan,active=p.filter(v=&gt;![&#x27;cancelled&#x27;,&#x27;skipped&#x27;].includes(v.status));return `&lt;div class=&quot;fp-kicker&quot;&gt;${s.routeStarted?&#x27;Your day&#x27;:&#x27;Review before starting&#x27;}&lt;/div&gt;&lt;h1&gt;${s.routeStarted?&#x27;Today’s route&#x27;:&#x27;Plan your route&#x27;}&lt;/h1&gt;&lt;p class=&quot;fp-small fp-muted&quot;&gt;${stamp(s.routeDate)} · ${active.length} visits · ${new Set(active.map(v=&gt;v.site)).size} facilities&lt;/p&gt;&lt;div class=&quot;fp-flex fp-wrap&quot;&gt;${b(icon(&#x27;plus&#x27;)+&#x27; Add stops&#x27;,&#x27;route-add&#x27;)}${b(icon(&#x27;settings-2&#x27;)+&#x27; Date &amp; start&#x27;,&#x27;route-settings&#x27;)}${s.routeDraft?link(&#x27;Discard changes&#x27;,&#x27;route-discard&#x27;):&#x27;&#x27;}&lt;/div&gt;${map(&#x27;route&#x27;)}&lt;p class=&quot;fp-small fp-muted&quot;&gt;Preview shows facility order only. Road routing and driving estimates are not connected.&lt;/p&gt;${p.length?`&lt;div class=&quot;fp-day&quot;&gt;${grouped(p).map((g,i)=&gt;`&lt;div class=&quot;fp-stop&quot;&gt;&lt;div class=&quot;fp-flex fp-spread&quot;&gt;&lt;h3&gt;${i+1}. ${esc(sites[g.site].name)}&lt;/h3&gt;&lt;span class=&quot;fp-small fp-muted&quot;&gt;${g.visits.length} visit${g.visits.length===1?&#x27;&#x27;:&#x27;s&#x27;}&lt;/span&gt;&lt;/div&gt;${g.visits.map(v=&gt;`&lt;div class=&quot;fp-routeitem&quot;&gt;&lt;div class=&quot;fp-flex&quot;&gt;&lt;button class=&quot;fp-row-main cursor-interaction&quot; data-act=&quot;entity:${v.entity}&quot;&gt;&lt;strong&gt;${esc(byId(v.entity).name)}&lt;/strong&gt;&lt;small&gt;${v.status===&#x27;done&#x27;?&#x27;Completed&#x27;:v.status===&#x27;cancelled&#x27;?&#x27;Cancelled&#x27;:v.status===&#x27;skipped&#x27;?&#x27;Skipped&#x27;:v.mode===&#x27;Appointment&#x27;?esc(v.time)+&#x27; · appointment&#x27;:&#x27;Flexible visit&#x27;} · ${v.duration} min&lt;/small&gt;&lt;/button&gt;&lt;div class=&quot;fp-order&quot;&gt;${ib(&#x27;arrow-up&#       function recap(){const done=s.plan.filter(v=&gt;v.status===&#x27;done&#x27;),skipped=s.plan.filter(v=&gt;[&#x27;skipped&#x27;,&#x27;cancelled&#x27;].includes(v.status)),remaining=s.plan.filter(v=&gt;v.status===&#x27;planned&#x27;),missing=done.filter(v=&gt;!s.notes.some(n=&gt;n.visit===v.id&amp;&amp;!n.deleted));return `&lt;div class=&quot;fp-kicker&quot;&gt;${stamp(s.routeDate)} · Your visits&lt;/div&gt;&lt;h1&gt;Summary&lt;/h1&gt;&lt;div class=&quot;fp-metrics&quot;&gt;${metric(&#x27;Completed&#x27;,done.length+&#x27; / &#x27;+s.plan.filter(v=&gt;v.status!==&#x27;cancelled&#x27;).length,&#x27;Separate visit records&#x27;)}${metric(&#x27;Follow-ups&#x27;,s.followups.filter(f=&gt;!f.done).length,&#x27;Open tasks&#x27;)}&lt;/div&gt;${missing.length?`&lt;div class=&quot;fp-note warn&quot;&gt;${missing.length} completed visit${missing.length===1?&#x27; has&#x27;:&#x27;s have&#x27;} no record yet.${missing.map(v=&gt;link(&#x27;Log &#x27;+esc(byId(v.entity).name),&#x27;log:&#x27;+v.entity)).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;fp-panel&quot;&gt;&lt;h2&gt;Completed&lt;/h2&gt;${done.length?done.map(v=&gt;`&lt;div class=&quot;fp-detail&quot;&gt;${link(esc(byId(v.entity).name),&#x27;entity:&#x27;+v.entity)}${s.notes.find(n=&gt;n.visit===v.id&amp;&amp;!n.deleted)?tag(&#x27;Record saved&#x27;,&#x27;good&#x27;):tag(&#x27;No visit record&#x27;,&#x27;warn&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;):&#x27;&lt;p class=&quot;fp-small fp-muted&quot;&gt;No completed visits yet.&lt;/p&gt;&#x27;}&lt;/div&gt;${remaining.length?`&lt;div class=&quot;fp-panel&quot;&gt;&lt;h2&gt;Remaining&lt;/h2&gt;${remaining.map(v=&gt;`&lt;div class=&quot;fp-detail&quot;&gt;${link(esc(byId(v.entity).name),&#x27;resume:&#x27;+v.id)}&lt;/div&gt;`).join(&#x27;&#x27;)}${b(&#x27;Continue visits&#x27;,&#x27;resume&#x27;,&#x27;fp-full&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}${skipped.length?`&lt;div class=&quot;fp-panel&quot;&gt;&lt;h2&gt;Skipped / cancelled&lt;/h2&gt;${skipped.map(v=&gt       function reportViewer(){const r=s.reports.find(r=&gt;r.id===s.reportId);if(!r)return &#x27;&lt;div class=&quot;fp-empty&quot;&gt;Report not found.&lt;/div&gt;&#x27;;const e=byId(r.entity);if(r.status===&#x27;generating&#x27;)return `&lt;div class=&quot;fp-panel&quot;&gt;&lt;div class=&quot;fp-kicker&quot;&gt;${esc(e.name)}&lt;/div&gt;&lt;h1&gt;Generating report&lt;/h1&gt;&lt;p class=&quot;fp-muted&quot;&gt;Preparing leakage analysis and the PDF.&lt;/p&gt;&lt;span class=&quot;fp-meter&quot;&gt;&lt;span style=&quot;width:62%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;p class=&quot;fp-small fp-muted fp-gap&quot;&gt;${esc(r.group)} · ${r.radius} miles · sample job&lt;/p&gt;${b(&#x27;Keep working&#x27;,&#x27;back&#x27;,&#x27;fp-full&#x27;)}${link(&#x27;Preview completed report&#x27;,&#x27;report-ready:&#x27;+r.id)}&lt;/div&gt;`;if(r.status===&#x27;failed&#x27;)return `&lt;div class=&quot;fp-panel&quot;&gt;&lt;h1&gt;Report unavailable&lt;/h1&gt;&lt;p class=&quot;fp-muted&quot;&gt;We couldn’t complete this preview.&lt;/p&gt;${b(&#x27;Retry&#x27;,&#x27;report-retry:&#x27;+r.id,&#x27;primary fp-full&#x27;)}${link(&#x27;All reports&#x27;,&#x27;reports&#x27;)}&lt;/div&gt;`;return `&lt;div class=&quot;fp-flex fp-wrap&quot;&gt;${b(icon(&#x27;sparkles&#x27;)+&#x27; Ask about report&#x27;,&#x27;ask-report:&#x27;+r.id,&#x27;soft&#x27;)}${b(icon(&#x27;share-2&#x27;)+&#x27; Share&#x27;,&#x27;share-report:&#x27;+r.id)}${b(icon(&#x27;download&#x27;)+&#x27; Download&#x27;,&#x27;export-report:&#x27;+r.id)}&lt;/div&gt;&lt;article class=&quot;fp-paper&quot;&gt;&lt;div class=&quot;fp-kicker&quot;&gt;DocNexus · Leakage report preview&lt;/div&gt;&lt;h1&gt;${esc(e.name)}&lt;/h1&gt;&lt;p class=&quot;fp-small fp-muted&quot;&gt;${esc(r.group)} · 2025 · ${r.radius}-mile comparison&lt;/p&gt;&lt;h2&gt;Account overview&lt;/h2&gt;&lt;p class=&quot;fp-small&quot;&gt;Illustrative report. All figures below are fictional.&lt;/p&gt;${detail(&#x27;Procedure claims&#x27;,fmt(vol(e,{...s,group:r.group})),&#       function askScreen(){const c=s.askContext,entity=c.kind===&#x27;report&#x27;?sites[s.reports.find(r=&gt;r.id===c.id)?.entity]:byId(c.id);return `&lt;div class=&quot;fp-flex fp-spread&quot;&gt;&lt;h1&gt;Ask&lt;/h1&gt;${link(&#x27;New chat&#x27;,&#x27;ask-new&#x27;)}&lt;/div&gt;&lt;div class=&quot;fp-note&quot;&gt;${icon(&#x27;sparkles&#x27;)} ${esc(entity?.name||getScope(s))} · ${esc(c.group||s.group)} · ${c.kind===&#x27;day&#x27;?&#x27;today’s route&#x27;:&#x27;2025 data&#x27;}${c.visit?&#x27; · current visit&#x27;:&#x27;&#x27;}&lt;/div&gt;${!s.messages.length?`&lt;p class=&quot;fp-muted&quot;&gt;Ask a question, prepare for a visit, or tell me what you want to do.&lt;/p&gt;&lt;div class=&quot;fp-stack fp-gap&quot;&gt;${b(&#x27;Who should I see in this territory?&#x27;,&#x27;prompt:Who should I see in this territory?&#x27;)}${b(&#x27;Prepare me for Dr. Maya Patel&#x27;,&#x27;prompt:Prepare me for Dr. Maya Patel&#x27;)}${b(&#x27;Find nearby HCPs to fill a cancelled visit&#x27;,&#x27;prompt:Find nearby HCPs to fill a cancelled visit&#x27;)}${b(&#x27;Explain this account’s leakage&#x27;,&#x27;prompt:Explain this account’s leakage&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;fp-chat&quot;&gt;${s.messages.map(m=&gt;`&lt;div class=&quot;fp-message ${m.role===&#x27;user&#x27;?&#x27;user&#x27;:&#x27;&#x27;}&quot;&gt;${m.role===&#x27;user&#x27;?esc(m.text):m.html+(m.context?&#x27;&lt;div class=&quot;fp-small fp-muted fp-gap&quot;&gt;&#x27;+esc(m.context)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;fp-small fp-muted&quot;&gt;Scripted conversation preview · no live AI or microphone.&lt;/div&gt;`;}

        if(kind===&#x27;provider-record&#x27;){const e=byId(d.entity);title=&#x27;Full provider record&#x27;;body=`&lt;h2&gt;${esc(e.name)}&lt;/h2&gt;${qr([&#x27;NPI&#x27;,&#x27;Specialty&#x27;,&#x27;Practice location&#x27;,&#x27;Primary organization&#x27;],[e.npi,e.specialty,&#x27;New York, NY &#x27;+S(e.id).zip,S(e.id).name])}&lt;h3 class=&quot;fp-gap&quot;&gt;Education &amp; training&lt;/h3&gt;&lt;p&gt;General surgery · sample professional record.&lt;/p&gt;&lt;h3&gt;Research&lt;/h3&gt;${qr([&#x27;Publications&#x27;,&#x27;Clinical trials&#x27;,&#x27;Society roles&#x27;],[&#x27;12&#x27;,&#x27;2&#x27;,&#x27;1&#x27;])}&lt;h3 class=&quot;fp-gap&quot;&gt;Clinical &amp; referral evidence&lt;/h3&gt;&lt;div class=&quot;fp-flex fp-wrap&quot;&gt;${b(&#x27;Procedure claims&#x27;,&#x27;ai-open:&#x27;+e.id+&#x27;:volumes&#x27;)}${b(&#x27;Referral network&#x27;,&#x27;ai-open:&#x27;+e.id+&#x27;:referrals&#x27;)}${b(&#x27;Notes &amp; visits&#x27;,&#x27;ai-open:&#x27;+e.id+&#x27;:activity&#x27;)}&lt;/div&gt;&lt;p class=&quot;fp-small fp-muted fp-gap&quot;&gt;Professional record preview; additional full-platform modules are outside this mobile mock.&lt;/p&gt;`;foot=b(&#x27;Back to HCP&#x27;,&#x27;close&#x27;,&#x27;primary&#x27;);}

        if(kind===&#x27;booking&#x27;){title=&#x27;Book appointment&#x27;;body=`&lt;h2&gt;${esc(byId(d.entity).name)}&lt;/h2&gt;&lt;div class=&quot;fp-kicker fp-gap&quot;&gt;Length&lt;/div&gt;&lt;div class=&quot;fp-pills&quot;&gt;${[15,30,45,60,90].map(n=&gt;`&lt;button class=&quot;fp-pill cursor-interaction&quot; data-act=&quot;booking-length:${n}&quot; aria-pressed=&quot;${Number(d.duration)===n}&quot;&gt;${n} min&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;fp-fieldline&quot;&gt;${field(&#x27;Day&#x27;,&#x27;date&#x27;,d.date,&#x27;date&#x27;)}${field(&#x27;Time&#x27;,&#x27;time&#x27;,d.time,&#x27;time&#x27;)}&lt;/div&gt;&lt;p class=&quot;fp-small fp-muted&quot;&gt;${esc(S(d.entity).name)} · ${d.duration} min&lt;/p&gt;${field(&#x27;Invite email&#x27;,&#x27;email&#x27;,d.email,&#x27;email&#x27;)}${textfield(&#x27;Agenda&#x27;,&#x27;agenda&#x27;,d.agenda)}${d.edit?select(&#x27;Appointment status&#x27;,&#x27;status&#x27;,d.status,[&#x27;Calendar draft&#x27;,&#x27;Requested&#x27;,&#x27;Confirmed&#x27;,&#x27;Cancelled&#x27;]):&#x27;&#x27;}&lt;p class=&quot;fp-small fp-muted&quot;&gt;Opens a prefilled calendar draft. Nothing is sent until saved in the calendar.&lt;/p&gt;`;foot=b(s.screen===&#x27;visit&#x27;?&#x27;Back to pre-read&#x27;:&#x27;Cancel&#x27;,&#x27;close&#x27;)+b(d.edit?&#x27;Save changes&#x27;:&#x27;Open invite&#x27;,&#x27;booking-save&#x27;,&#x27;primary&#x27;);}

      function switchDay(date){s.plansByDay={...s.plansByDay,[s.routeDate]:copy(s.plan)};s.plan=copy(s.plansByDay[date]||[]);s.routeDate=date;s.routeDraft=null;s.selected=s.plan.filter(v=&gt;v.status!==&#x27;cancelled&#x27;).map(v=&gt;v.entity);s.routeStarted=false;s.currentVisit=s.plan.find(v=&gt;v.status===&#x27;planned&#x27;)?.id||null;live.preTab=&#x27;overview&#x27;;s.preReadTab=&#x27;overview&#x27;;save();}

    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
