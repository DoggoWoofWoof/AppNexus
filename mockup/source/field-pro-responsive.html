 function workspaceKey(){return Model.scopeKey(state.workspace)}
 function activeDraft(){return state.drafts[state.currentDraftId]}
 function storageLabel(){if(!deviceStore.persistent)return 'Preview memory only · Refresh clears this work';return state.storageError?'Not saved · '+state.storageError:state.storageStatus==='saving'?'Saving on this device…':'Saved on this device'}
 function updateStorageLabel(){el.querySelectorAll('[data-device-status]').forEach(x=>x.textContent=storageLabel())}
 function persistWork(){
  const scope=workspaceKey(),snapshot=Model.clone(state);state.storageStatus='saving';updateStorageLabel();
  const operation=persistenceQueue.catch(()=>{}).then(()=>{
   if(state.scenario==='storage-full')throw new Error('Device storage is full. Keep this page open or download the audio.');
   return deviceStore.save(scope,snapshot);
  });
  persistenceQueue=operation;
  operation.then(()=>{if(scope===workspaceKey()){state.storageStatus='saved';state.storageError='';updateStorageLabel()}},error=>{if(scope===workspaceKey()){state.storageStatus='failed';state.storageError=error.message;updateStorageLabel()}});
  return operation;
 }

  return `${backrow()}<span class="day-kicker">Meeting prep</span><h1>${p.name}</h1><p class="day-muted">${p.kind==='hcp'?p.place:p.city}${item?' · '+esc(item.time)+' · '+bookingLabel(item):''}</p><div class="day-prep-section"><h2>Meeting goal</h2><p>${esc(item?.goal||'Agree the next useful step for this account.')}</p>${button(item?'Edit goal & time':'Book appointment',`data-book="${p.id}"`,'link')}</div><div class="day-prep-section"><h2>Pick up the conversation</h2><p>${note?esc(shortText(note.correctedTranscript||note.text||note.outcome)):p.id==='maya'?'Sample previous request: procedure mix report.':'No previous conversation loaded.'}</p>${state.tasks.filter(t=>!t.done&&t.target===p.id&&state.notes.some(n=>n.id===t.note&&!n.deletedAt)).map(t=>link(esc(t.text),'Due '+t.due,`data-task="${t.id}"`)).join('')}${note?button('Read conversation',`data-review-note="${note.id}"`,'link'):''}</div><div class="day-prep-section"><h2>Bring to the meeting</h2>${materials.map(m=>`<div class="day-material"><span class="day-name">${esc(m.name)}</span><span class="day-caption">${m.status==='ready'?'Demo brief ready'+(m.offlineAsset?' · Offline copy saved':''):m.status==='failed'?'Demo generation failed':'Generating demo brief…'}</span><div class="day-actions">${m.status==='ready'?button('Open brief',`data-view-material="${m.id}"`)+button('Download / save offline',`data-save-material="${m.id}"`):m.status==='failed'?button('Retry',`data-retry-material="${m.id}"`):''}${button('Remove',`data-remove-material="${m.id}"`,'link')}</div>${state.openMaterial===m.id?`<pre class="day-document">${esc(m.content)}</pre>`:''}</div>`).join('')||'<p class="day-muted">Add only what supports this meeting.</p>'}${button('Add report or insight','data-open="materials"','link')}<p class="day-caption">Generated briefs use fixtures. Keep a copy on this device before going offline.</p></div>${state.captureError?`<p class="day-notice" role="alert">${esc(state.captureError)}</p>`:''}<div class="day-actions">${button('Log visit',`data-capture="${p.id}" data-capture-visit="${item?.id||''}"`,'primary')}${button('Full profile','data-open="sections"')}</div>`;
 }
 function candidateFor(person,item){
  const next=state.items.filter(i=>i.day===item.day&&!i.cancelled&&!i.done&&i.mode==='timed'&&i.time>item.time).sort((a,b)=>a.time.localeCompare(b.time))[0];
  const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
  const from=find(item.target).account||item.target,to=person.account;
  // Explicit fixture matrix, in seconds. Replace with a routing-provider adapter.
  const matrix={riverside:{riverside:0,westside:900,eastside:1200},westside:{riverside:960,westside:0,eastside:1020},eastside:{riverside:1260,westside:1080,eastside:0}};
  const call=state.recoveryMode==='call',incoming=call?0:matrix[from]?.[to],outgoing=call||!next?0:matrix[to]?.[find(next.target).account||next.target];
  const duration=Math.min(item.duration,30),available=next?minutes(next.time)-minutes(item.time):item.duration+30;
  const fit=Model.assessCandidate({previousSeconds:incoming,nextSeconds:outgoing,availableMinutes:available,durationMinutes:duration,availability:state.scenario==='no-candidates'?'unavailable':person.id==='alex'?'confirmed':'unknown'});
  const arrival=minutes(item.time)+Math.ceil((incoming||0)/60),time=String(Math.floor(arrival/60)).padStart(2,'0')+':'+String(arrival%60).padStart(2,'0');
  return {person,fit,incoming,outgoing,time,duration};
 }
 function recovery(){
  const item=state.items.find(i=>i.id===state.gap?.visitId&&i.cancelled);if(!item)return `${backrow()}<h1>No open slot</h1>${button('Back to Today','data-nav="today"','primary')}`;
  const candidates=people.filter(p=>p.id!==item.target&&!pendingGaps(item.day).some(i=>i.target===p.id)&&!state.items.some(i=>i.target===p.id&&i.day===item.day&&!i.cancelled)).map(p=>candidateFor(p,item)).filter(c=>['feasible','tentative'].includes(c.fit.state)).sort((a,b)=>Number(b.fit.state==='feasible')-Number(a.fit.state==='feasible')||a.incoming-b.incoming);
  return `${button('Back to Today','data-nav="today"','link')}<span class="day-kicker">${esc(item.time)} opening</span><h1>Find an alternative</h1><p class="day-muted">${find(item.target).name} cancelled. Other commitments stay fixed.</p><div class="day-actions">${button('Visit nearby','data-recovery-mode="visit"',state.recoveryMode==='call'?'secondary':'primary')}${button('Make a call','data-recovery-mode="call"',state.recoveryMode==='call'?'primary':'secondary')}</div><p class="day-caption">Demo driving matrix + 10 minute buffer. Availability is a fixture, never a live guarantee.</p>${candidates.map(c=>`<div class="day-alternative"><span class="day-name">${c.person.name}</span><p class="day-muted">${c.person.place}</p><p class="day-reason">${c.person.reason} · ${Math.ceil(c.incoming/60)} min ${state.recoveryMode==='call'?'travel for call':'mock drive'}</p><p class="day-caption">${c.fit.reason} · ${c.time}, ${c.duration} min</p><div class="day-actions">${button(c.fit.state==='tentative'?'Plan tentatively':'Use this slot',`data-replace="${c.person.id}"`,'primary')}${button('View brief',`data-profile="${c.person.id}"`)}</div></div>`).join('')||'<p class="day-notice">No suitable alternatives fit this slot. Try a call, search targets or keep the time open.</p>'}<div class="day-actions">${button('Search targets','data-nav="targets"')}${button('Keep slot open','data-leave-gap')}${button('Undo cancellation','data-undo-cancel')}</div>`;
 }

   const replacement={...freshItem(c.person.id),day:old.day,mode:'timed',time:c.time,duration:c.duration,type:state.recoveryMode==='call'?'Phone call':'In-person visit',confirmed:false,availability:c.fit.state,replacesVisitId:old.id};
   state.items.splice(state.items.indexOf(old)+1,0,replacement);state.day=old.day;closeGap(old.id);state.page='today';state.nav='today';state.history=[];state.notice='Alternative planned. Confirm with the office before travelling.';render();remember();

  el.querySelectorAll('[data-remove-material]').forEach(b=>b.onclick=async()=>{const m=state.materials.find(x=>x.id===b.dataset.removeMaterial);state.materials=state.materials.filter(x=>x!==m);await persistenceQueue.catch(()=>{});await deviceStore.deleteBundle(workspaceKey(),state,m?.offlineAsset?[m.offlineAsset]:[]);render()});
  el.querySelector('[data-return-recording]')?.addEventListener('click',e=>{const draft=state.drafts[e.currentTarget.dataset.returnRecording];if(draft)beginCapture(draft.source,draft.id)});
 }
