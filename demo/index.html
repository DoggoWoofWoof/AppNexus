<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Field Pro · DocNexus prototype</title>
  <meta name="description" content="Clickable prototype of DocNexus Field Pro, a day planner and HCP/HCO profile app for medical device sales reps. Sample data only.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232447C4'/%3E%3Cpath d='M6 17h5l3-7 4 13 3-6h5' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/preview.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="preview">
    <p class="preview-title"><strong>Field Pro</strong><span>Clickable prototype · sample data</span></p>
    <details>
      <summary><span>Preview settings</span><span class="preview-summary" data-summary></span></summary>
      <div class="preview-groups">
        <div class="preview-group" role="group" aria-label="Device">
          <span class="preview-label">View</span>
          <button type="button" data-pref="view" data-value="phone">Phone</button>
          <button type="button" data-pref="view" data-value="wide">Wide screen</button>
        </div>
        <div class="preview-group" role="group" aria-label="Text size">
          <span class="preview-label">Text</span>
          <button type="button" data-pref="text" data-value="1">100%</button>
          <button type="button" data-pref="text" data-value="2">200%</button>
        </div>
        <div class="preview-group" role="group" aria-label="Theme">
          <span class="preview-label">Theme</span>
          <button type="button" data-pref="theme" data-value="system">System</button>
          <button type="button" data-pref="theme" data-value="light">Light</button>
          <button type="button" data-pref="theme" data-value="dark">Dark</button>
        </div>
        <div class="preview-group" role="group" aria-label="Network" data-group="network">
          <span class="preview-label">Network</span>
        </div>
        <button type="button" class="preview-reset" data-reset>Reset sample data</button>
      </div>
    </details>
  </header>
  <div class="stage">
    <div class="device" data-view="phone">
      <div id="app" class="app-root"></div>
    </div>
  </div>
  <noscript><p class="noscript">Field Pro needs JavaScript to run.</p></noscript>
</body>
</html>
