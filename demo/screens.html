<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Pro · Screen and action review</title>
  <style>
    :root{color-scheme:light dark;font:16px/1.5 Arial,Helvetica,sans-serif;background:light-dark(#f1f3f7,#0c1322);color:light-dark(#162134,#f5f7fc)}
    *{box-sizing:border-box}body{margin:0;padding:24px;max-width:1500px;margin-inline:auto}a{color:light-dark(#2447c4,#b5ceff)}header{max-width:780px;margin-bottom:28px}h1{font-size:28px;line-height:1.2;margin:20px 0 12px}h2{font-size:18px;margin:0 0 8px}p{margin:8px 0}header a{display:inline-flex;align-items:center;min-height:44px}.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:24px}.review-grid figure{margin:0;min-width:0}.review-grid figcaption{min-height:112px}.review-grid p{font-size:14px;color:light-dark(#4e5e74,#bdcbe0)}.review-grid img{display:block;max-width:100%;width:auto;height:640px;object-fit:contain;object-position:top;background:light-dark(#ffffff,#1b293f);border:1px solid light-dark(#c3ccda,#4a5d7b);border-radius:14px}.review-grid a{display:block}footer{margin-top:32px;font-size:14px}@media(max-width:600px){body{padding:16px}.review-grid figcaption{min-height:0;margin-bottom:12px}.review-grid img{height:auto;max-height:900px}}
  </style>
</head>
<body>
  <header><a href="./">← Open the interactive demo</a><h1>Field Pro screens & actions</h1><p>Actual captures from the mock demo. Frequent actions use visible buttons; visit capture sits in its own section. Select an image to inspect the full capture.</p></header>
  <main class="review-grid">
    <figure><figcaption><h2>Today</h2><p>Prepare is the main action. Log visit is an outlined button in the separate Notes, audio & outcome section.</p></figcaption><a href="../docs/screenshots/actions-today.jpg"><img src="../docs/screenshots/actions-today.jpg" alt="Today with separate preparation and visit-capture controls"></a></figure>
    <figure><figcaption><h2>HCP & meeting prep</h2><p>Edit time, Full profile, History and Add material are visible. Capture follows the preparation content.</p></figcaption><a href="../docs/screenshots/actions-brief.jpg"><img src="../docs/screenshots/actions-brief.jpg" alt="Meeting brief with outlined context buttons and a Log visit footer"></a></figure>
    <figure><figcaption><h2>Appointment</h2><p>The form ends with a clear request or save action. Personal time holds remain a separate choice.</p></figcaption><a href="../docs/screenshots/actions-booking.jpg"><img src="../docs/screenshots/actions-booking.jpg" alt="Appointment form and its request and save controls"></a></figure>
    <figure><figcaption><h2>Log visit</h2><p>Notes and recording are optional. Save visit as introduces the explicit outcome buttons.</p></figcaption><a href="../docs/screenshots/actions-capture.jpg"><img src="../docs/screenshots/actions-capture.jpg" alt="Visit capture form with note, recording and outcome buttons"></a></figure>
    <figure><figcaption><h2>Activity</h2><p>Log a visit and Saved work are visible at the top. Conversation rows have clear boundaries and arrows.</p></figcaption><a href="../docs/screenshots/actions-activity.jpg"><img src="../docs/screenshots/actions-activity.jpg" alt="Activity with visible capture and saved-work controls"></a></figure>
    <figure><figcaption><h2>Conversation</h2><p>Review the summary and actions first. Source audio and transcript editing remain available.</p></figcaption><a href="../docs/screenshots/actions-conversation.jpg"><img src="../docs/screenshots/actions-conversation.jpg" alt="Conversation summary with follow-up, transcript and editing controls"></a></figure>
    <figure><figcaption><h2>Cancellation recovery</h2><p>The cancelled appointment and Undo appear first. Choose a replacement, view its brief, or leave the time open. A replacement stays tentative until confirmed.</p></figcaption><a href="../docs/screenshots/actions-recovery.jpg"><img src="../docs/screenshots/actions-recovery.jpg" alt="Alternative candidates with visible selection and brief buttons"></a></figure>
    <figure><figcaption><h2>Insights</h2><p>The three common destinations are clear button rows. Specialist tools have a labelled expandable control.</p></figcaption><a href="../docs/screenshots/actions-insights.jpg"><img src="../docs/screenshots/actions-insights.jpg" alt="Insights with three prominent tool destinations and specialist tools"></a></figure>
    <figure><figcaption><h2>Targets & map</h2><p>The shared list and map remain direct discovery views, with filters and target actions.</p></figcaption><a href="../docs/screenshots/actions-map.jpg"><img src="../docs/screenshots/actions-map.jpg" alt="Target map with site selection and actions"></a></figure>
    <figure><figcaption><h2>Cancel or reschedule</h2><p>Two explicit choices beside the visit: Doctor cancelled opens replacements; Reschedule opens the appointment editor.</p></figcaption><a href="../docs/screenshots/actions-cancel-menu.jpg"><img src="../docs/screenshots/actions-cancel-menu.jpg" alt="Expanded cancellation and rescheduling choices on Today"></a></figure>
    <figure><figcaption><h2>Replacement planned</h2><p>The chosen person and arrival time appear in Today as a planned time. The 14:00 appointment stays fixed.</p></figcaption><a href="../docs/screenshots/actions-replacement-planned.jpg"><img src="../docs/screenshots/actions-replacement-planned.jpg" alt="Today with a tentative replacement visit and unchanged later appointment"></a></figure>
  </main>
  <footer>Sample data and mocked services · <a href="../docs/action-placement.md">Action-placement notes and verification</a></footer>
</body>
</html>
