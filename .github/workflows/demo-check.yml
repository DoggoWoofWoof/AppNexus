name: Check demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check every module
        run: for f in $(find demo/js -name '*.js'); do node --check "$f" || exit 1; done
      - name: Tests
        run: npm test
