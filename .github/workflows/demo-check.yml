name: Check static demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-demo.py
      - run: python scripts/check-demo.py
      - run: node --check demo/app.js && node --check demo/shell.js
      - run: git diff --exit-code -- demo/index.html demo/app.css demo/app.js
